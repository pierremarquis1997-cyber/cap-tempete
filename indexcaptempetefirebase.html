  const tab = ui.collTab || 'tro', s = COLL.st, got = COLL.got;
  const nGot = BADGES.filter(b => got[b[0]]).length;
  const tabs = [['tro', `🏆 Trophées ${nGot}/${BADGES.length}`], ['bes', `🐙 Bestiaire ${len(Object.keys(s.foes || {}))}/${ALL_FOES.length}`], ['car', `🃏 Cartes ${len(Object.keys(s.seenCards || {}))}/${ALL_CARDS.length}`]];
  let body = '';
  if(tab === 'tro'){
    body = BADGE_CATS.map(([cat, label]) => `<h3 class="subh">${label}</h3><div class="badges">${BADGES.filter(b => b[1] === cat).map(b => {
      const on = got[b[0]], goal = b[6], cur = goal ? Math.min(goal, b[7](s)) : 0;
      return `<div class="badge ${on ? 'on' : ''}" title="${esc(b[4])}" data-act="coll-info" data-k="b" data-id="${b[0]}"><span class="bi">${b[2]}</span><b>${esc(b[3])}</b><small>${esc(b[4])}</small>
        ${on ? `<em>✓ ${new Date(on).toLocaleDateString('fr-FR')}</em>` : goal ? `<span class="bar"><i style="width:${cur / goal * 100}%"></i></span><em>${cur} / ${goal}</em>` : ''}</div>`; }).join('')}</div>`).join('')
      + `<p class="note">Tes trophées sont enregistrés sur cet appareil, dans ce navigateur.</p>`;
  } else if(tab === 'bes'){
    const groups = [['Menaces', t => !FOES[t].el && !FOES[t].boss && !FOES[t].min], ['Élites', t => FOES[t].el], ['Boss', t => FOES[t].boss], ['Sbires', t => FOES[t].min]];
    body = groups.map(([label, f]) => `<h3 class="subh">${label}</h3><div class="beasts">${ALL_FOES.filter(f).map(t => {
      const F = FOES[t], k = (s.foes || {})[t];
      if(!k) return `<div class="beast off" data-act="coll-info" data-k="f" data-id="${t}"><span class="bi">${F.ic}</span><b>???</b><small>Pas encore rencontré</small></div>`;
      const acts = [...new Set(F.it.map(x => INTENT_NAMES[x[0]] || x[0]))], pas = [];
      if(F.guard) pas.push('🛡 Gardien'); if(F.sup) pas.push('🔗 Soutien'); if(F.arm) pas.push('🔰 Peau glissante'); if(F.keep) pas.push('🐚 Carapace'); if(F.reform) pas.push('⚰️ Se relève'); if(F.cap) pas.push('🪸 Carapace de corail'); if(F.seer) pas.push("👁️ Liseur d'âmes"); if(F.dive) pas.push('🌊 Plonge');
      return `<div class="beast" data-act="coll-info" data-k="f" data-id="${t}"><span class="bi">${F.ic}</span><b>${esc(F.n)}</b><small>Épopée${foeWhere(t).length > 1 ? 's' : ''} ${foeWhere(t).join(', ') || '–'} · ${F.hp} PV de base</small>
        <small>${esc(acts.join(' · '))}${pas.length ? '<br>' + esc(pas.join(' · ')) : ''}</small><em>Vu ${k[0]} fois · vaincu ${k[1]} fois</em></div>`; }).join('')}</div>`).join('');
  } else {
    const order = c => { const C = CARDS[c]; return C.junk ? 9 : C.leg ? 8 : C.role ? 0 : !C.f ? 1 : 2 + 'FMCT'.indexOf(C.f); };
    const codes = [...ALL_CARDS].sort((a, b) => order(a) - order(b) || (CARDS[a].$ || 0) - (CARDS[b].$ || 0));
    const groupOf = c => { const C = CARDS[c]; return C.leg ? '✨ Légendaires' : C.role || !C.f ? 'Cartes de départ et de rôle' : `${FACTIONS[C.f].ic} ${FACTIONS[C.f].n}`; };
    const gs = []; codes.forEach(c => { const g = groupOf(c); let x = gs.find(y => y[0] === g); if(!x){ x = [g, []]; gs.push(x); } x[1].push(c); });
    const nOwn = len(Object.keys(s.ownCards || {}));
    body = `<p class="note">${len(Object.keys(s.seenCards || {}))} cartes découvertes, ${nOwn} obtenues sur ${ALL_CARDS.length}.</p>` + gs.map(([g, cs]) => `<h3 class="subh">${g}</h3><div class="grid collgrid">${cs.map(c => {
      if(!(s.seenCards || {})[c]) return `<div class="card cardback" data-act="coll-info" data-k="c" data-id="${c}"><span>?</span></div>`;
      return `<div class="cwrap ${(s.ownCards || {})[c] ? 'own' : 'seen'}" data-act="coll-info" data-k="c" data-id="${c}">${cardHTML(c, 'tabindex="-1" aria-disabled="true"', '', {cost:CARDS[c].$ ? 1 : 0})}${(s.ownCards || {})[c] ? '<span class="stamp">✓ obtenue</span>' : ''}</div>`; }).join('')}</div>`).join('');
  }
  app.innerHTML = `<button class="back" data-act="menu">‹ Retour</button>
    <div class="panel"><h2>🏆 Mes collections</h2><div class="colltabs">${tabs.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" data-act="coll-tab" data-t="${k}">${l}</button>`).join('')}</div>${body}</div>`;
}

  {t:"Une brèche doit être <b>colmatée</b> avant le prochain tour des menaces, sinon le navire est <b>vulnérable</b> : tous les dégâts sur la coque font <b>×1,5</b> ! Toute protection gagnée sert d'abord à reboucher la brèche. Le Charpentier a pioché <b>Écoper</b> 🪣 (+3 protection) : <b>joue-la</b>. 2 points referment la brèche, le dernier protège le navire.", hl:'.seat[data-s="1"], #hand .card[data-c="ec"]', wait:'Joue Écoper (passe au Charpentier si besoin).', until:v => v.phase !== 'fight' || (v.round >= 3 && !v.br)},
  {t:"Brèche colmatée ! Retiens-le : sans serviteurs solides à bord, chaque abordage coûte cher. Dernière arme : chaque rôle a un <b>coup d'éclat</b>, le médaillon en bas, utilisable une fois par combat. Déclenche-le au bon moment, puis achevez le requin !", hl:'#eclatBtn', wait:'Achève le requin.', until:v => v.phase !== 'fight'},
];
function renderCoach(){
  const SCRIPT = coachScript();
  if(ui.coach < 0 || !SCRIPT){ placeCoachArrow(null); return; }
  while(ui.coach < SCRIPT.length && SCRIPT[ui.coach].until && SCRIPT[ui.coach].until(pv)) ui.coach++;
  if(ui.coach >= SCRIPT.length || pv.phase !== 'fight'){ ui.coach = -1; placeCoachArrow(null); return; }
  const step = SCRIPT[ui.coach], fresh = ui.coachShown !== ui.coach;
  $('#app').insertAdjacentHTML('afterbegin', `<div class="coach ${fresh ? 'fresh' : ''} ${step.over ? 'over' : ''}" role="status">
    <div class="ctop"><span>Étape ${ui.coach + 1}/${SCRIPT.length}</span><span class="cbar"><i style="width:${(ui.coach + 1) / SCRIPT.length * 100}%"></i></span><button class="cskip" data-act="coach-skip">Passer</button></div>
    <p>${typeof step.t === 'function' ? step.t(pv) : step.t}</p>
    <div class="cact">${step.next ? '<button data-act="coach-next">Suivant</button>' : `<span class="cwait">👉 ${step.wait || ''}</span>`}</div></div>`);
  const hl = typeof step.hl === 'function' ? step.hl(pv) : step.hl, els = hl ? [...document.querySelectorAll(hl)] : [];
  els.forEach(el => el.classList.add('coach-hl'));
  const target = els.find(el => el.getClientRects().length);
  if(fresh){
    ui.coachShown = ui.coach;
    const inPage = els.find(el => el.getClientRects().length && !el.closest('#dock'));
    if(inPage && !target.closest('#dock')) setTimeout(() => coachScroll(inPage), 60);
  }
  ui.coachTarget = step.over ? null : target || null;   // over a sheet: the golden outline is enough (the sheet is still sliding in)
  requestAnimationFrame(() => placeCoachArrow(ui.coachTarget));
  if(fresh) setTimeout(() => placeCoachArrow(ui.coachTarget), 380);   // once the bubble has popped in
}
// glide slowly to what the coach shows, so the player sees where it is on the page (between the coach bubble and the dock)
function coachScroll(el){
  const cb = $('.coach'), dk = $('#dock'), r = el.getBoundingClientRect();
  const top = cb ? cb.getBoundingClientRect().bottom + 8 : 0, bottom = innerHeight - (dk && !dk.hidden ? dk.offsetHeight : 0) - 8;
  const room = bottom - top, want = r.height <= room ? r.top + r.height / 2 - (top + room / 2) : r.top - top;   // centre it, or show its top if it is taller than the room
  const from = scrollY, to = Math.max(0, Math.min(document.documentElement.scrollHeight - innerHeight, from + want));
  if(Math.abs(to - from) < 4) return;
  if(reduced){ scrollTo(0, to); return; }
  const dur = Math.min(1400, 500 + Math.abs(to - from) * .9), t0 = performance.now(), ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const tick = now => { const t = Math.min(1, (now - t0) / dur); scrollTo(0, from + (to - from) * ease(t)); if(t < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function placeCoachArrow(el){
  let a = $('#coachArrow');
  if(!el || !document.body.contains(el)){ if(a) a.remove(); return; }
  if(!a){ a = document.createElement('div'); a.id = 'coachArrow'; a.className = 'coach-arrow'; document.body.appendChild(a); }
  const r = el.getBoundingClientRect(), cb = $('.coach') ? $('.coach').getBoundingClientRect() : null;
  const below = (r.top < 170 || (cb && cb.bottom > r.top - 46 && cb.top < r.top)) && !el.closest('#dock');
  a.textContent = below ? '👆' : '👇'; a.classList.toggle('up', below);
  const x = Math.max(8, Math.min(innerWidth - 44, r.left + Math.min(r.width, 200) / 2 - 17));
  a.style.left = x + 'px'; a.style.top = (below ? r.bottom + 6 : r.top - 44) + 'px';
}
addEventListener('scroll', () => { if(ui.coachTarget) placeCoachArrow(ui.coachTarget); }, {passive:true});
addEventListener('resize', () => { if(ui.coachTarget) placeCoachArrow(ui.coachTarget); });

/* =========================================================== INPUT */
let toastT;
// something useful is still waiting in this sailor's hand, pool or on the deck (an unpaid mercenary doesn't count)
const leftToPlay = S => !S.ab && !S.rd && (S.hand.some(c => c !== 'bl') || S.champ.some(p => !p.u && !(CARDS[p.c].up && S.g < CARDS[p.c].up)));
function toast(t){ const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = 'none', 2600); }
document.addEventListener('keydown', ev => {
  if((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('role') === 'button' && ev.target.dataset.act){ ev.preventDefault(); ev.target.click(); return; }
  if(ev.key === 'Escape' && ui.deckOpen != null){ ui.deckOpen = null; if(ui.coach >= 0) render(); else renderSheet(); return; }
  if((ev.key === 'd' || ev.key === 'D') && !ev.target.closest('input, textarea') && pv && pv.phase === 'fight' && activeSeat() >= 0){
    if(ui.deckOpen == null) ui.deckF = 'all'; ui.deckOpen = ui.deckOpen == null ? activeSeat() : null; if(ui.coach >= 0) render(); else renderSheet();
  }
});
document.addEventListener('input', ev => { if(ev.target.id === 'nick') ui.nick = ev.target.value; });
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if(!b || b.disabled) return;
  if(ui.playing && !['menu','quit','ask-quit','quit-ok','foe-info','coll-close','deck','deck-close','deck-f'].includes(b.dataset.act)) return; // the enemy turn is being replayed
  const A = b.dataset.act, s = activeSeat(), S = s >= 0 && pv ? pv.seats[s] : null;
  const busy = () => { if(S && S.rd){ toast('Tu as terminé ton tour. Touche « Annuler » pour rejouer.'); return true; } return false; };
  switch(A){
    case 'menu': case 'quit': quitToMenu(); break;
    case 'ask-quit': askQuit(); break;
    case 'quit-ok': { const q = $('#quitask'); if(q) q.remove(); quitToMenu(); break; }
    case 'tuto': startTutorial(); break;
    case 'camp': quitToMenu(); ui.screen = 'camp'; render(); window.scrollTo(0, 0); break;
    case 'camp-sel': ui.campSel = ui.campSel === b.dataset.id ? null : b.dataset.id; render(); break;
    case 'camp-set': { const have = campClasses(); ui.cloc[b.dataset.r] = b.dataset.v; render(); break; }
    case 'camp-go': startCamp(b.dataset.id); break;
    case 'camp-retry': { const id = pv && pv.cp; if(id){ quitToMenu(); startCamp(id); } break; }
    case 'camp-next': { const id = b.dataset.id; quitToMenu(); ui.screen = 'camp'; ui.campSel = id; render(); window.scrollTo(0, 0); break; }
    case 'solo-setup': quitToMenu(); ui.screen = 'solo-setup'; render(); break;
    case 'coll': quitToMenu(); ui.screen = 'coll'; ui.collTab = ui.collTab || 'tro'; render(); window.scrollTo(0, 0); break;
    case 'coll-end': quitToMenu(); ui.screen = 'coll'; ui.collTab = 'tro'; render(); window.scrollTo(0, 0); break;
    case 'coll-tab': ui.collTab = b.dataset.t; render(); break;
    case 'coll-info': openCollInfo(b.dataset.k, b.dataset.id); break;
    case 'foe-info': ev.stopPropagation(); if(pv && pv.sub && mySeats().includes(pv.cps) && pv.atk > 0 && !ev.target.closest('.traits')){
        const E = pv.en[+b.dataset.e];
        if(E && E.hp > 0 && E.cap && E.tk >= E.cap) toast(`La carapace de corail tient bon : le Titan ne perdra plus de vie ce tour (${E.cap} max par tour).`);
        else if(E && E.inv) toast(`${FOES[E.t].the || FOES[E.t].n} a plongé : impossible de le toucher ce tour.`);
        else if(E && E.hp > 0 && !FOES[E.t].guard && pv.en.some(o => o.hp > 0 && FOES[o.t].guard)) toast('Protégé par ses gardiens 🛡 : élimine-les d\'abord.');
        else if(E && E.hp > 0) toast('Touche la bulle ⚔ sur la menace pour tirer.');
        return; } openFoeInfo(+b.dataset.e); break;
    case 'coll-close': { const m = b.closest('.collmodal'); if(m) m.remove(); break; }
    case 'bots-setup': quitToMenu(); ui.screen = 'bots-setup'; render(); break;
    case 'bots-me': ui.botMe = b.dataset.r; ui.botMates = ui.botMates.filter(r => r !== ui.botMe); if(!ui.botMates.length) ui.botMates = [Object.keys(ROLES).find(r => r !== ui.botMe)]; render(); break;
    case 'bots-mate': { const r = b.dataset.r, l = ui.botMates; ui.botMates = l.includes(r) ? l.filter(x => x !== r) : [...l, r]; render(); break; }
    case 'bots-go': startBots(); break;
    case 'solo-role': { const r = b.dataset.r, l = ui.soloRoles; ui.soloRoles = l.includes(r) ? l.filter(x => x !== r) : [...l, r].slice(-2); render(); break; }
    case 'solo-go': startLocal(); break;
    case 'local-set': ui.local = {...ui.local, [b.dataset.r]:b.dataset.v}; render(); break;
    case 'online': if(mode) quitToMenu(); ui.screen = 'online'; render(); break;
    case 'host-role': ui.hostRole = b.dataset.r; render(); break;
    case 'host-mode': ui.hostCamp = b.dataset.v === 'camp' ? (ui.hostCamp || campDefault()) : null; render(); break;
    case 'host-camp': ui.hostCamp = b.dataset.id; render(); break;
    case 'lob-mode': act({a:'camp', id:b.dataset.v === 'camp' ? (pv.cp || campDefault()) : null}); break;
    case 'lob-camp': act({a:'camp', id:b.dataset.id}); break;
    case 'relaunch': act({a:'relaunch', id:b.dataset.id}); break;
    case 'again': { if(ui.last && ui.last.k === 'local'){ const c = ui.last.cfg; quitToMenu(); ui.local = c; startLocal(); break; }
      if(ui.last && ui.last.k === 'bots'){ const L = ui.last; quitToMenu(); ui.botMe = L.me; ui.botMates = L.mates; startBots(); break; }
      const roles = pv && pv.seats.length === 2 ? pv.seats.map(x => x.r) : ui.soloRoles; quitToMenu(); ui.soloRoles = roles; startSolo(); break; }
    case 'purge-mode': if(S && !busy()){ ui.purge = !ui.purge; if(ui.purge) toast(`Touche une carte de ta main : elle est jetée par-dessus bord et quitte ton deck pour de bon (${S.ft ? 'gratuit' : '🕯️' + PURGE_COST(S)}).`); render(); } break;
    case 'pick': if(S) act({a:'pick', s, o:+b.dataset.o}); break;
    case 'mark': if(S){
      const c = b.dataset.c, m = +b.dataset.m, rm = pv.port.rm[s] || [], owned = deckOf(S).filter(x => x === c).length;
      const lim = markLimit(pv.port, s), add = rm.length < lim && m < owned && !(m > 0 && owned === 1);
      if(!add && !m){ toast(`Tu jettes déjà ${lim} cartes. Touche l'une d'elles pour la garder.`); return; }
      act({a:'mark', s, c, v:add}); } break;
    case 'create': createTable(); break;
    case 'join': joinTable(b.dataset.p, b.dataset.r); break;
    case 'take': act({a:'join', n:cleanName(ui.nick), r:b.dataset.r}); break;
    case 'drop': act({a:'drop', r:b.dataset.r}); break;
    case 'start': act({a:'start'}); break;
    case 'seat': { const i = +b.dataset.s; if(mySeats().includes(i) && i !== ui.as){ const y = window.scrollY; ui.as = i; ui.deal = true; ui.purge = false; render(); window.scrollTo(0, y); } break; }
    case 'play': {
      if(!S || busy()) return;
      if(ui.purge){ ui.purge = false; act({a:'purge', s, h:+b.dataset.h, c:b.dataset.c}); break; }
      const from = b.getBoundingClientRect(), html = b.outerHTML;
      act({a:'play', s, h:+b.dataset.h, c:b.dataset.c});
      flyGhost(html, from, playTarget(s, b.dataset.c));
      if(CARDS[b.dataset.c].pl && CARDS[b.dataset.c].pl.tr){ ui.purge = true; render(); toast('Cale sèche : touche la carte de ta main à jeter par-dessus bord (gratuit).'); }
      break;
    }
    case 'sach': if(S && !busy()){ if(ui.purge && S.ft){ ui.purge = false; act({a:'purge', s, h:+b.dataset.h, c:'bl'}); } else act({a:'sach', s, h:+b.dataset.h}); } break;
    case 'mkrm': if(S && !busy()){ if(!S.mf && S.g < mkCost(S)){ toast(`Il te faut ${mkCost(S)} 🕯️ pour écarter une caisse (le prix revient à 1 à la prochaine étape).`); return; } act({a:'mkrm', s, m:+b.dataset.m}); } break;
    case 'all': {
      if(!S || busy()) return;
      const cards = [...document.querySelectorAll('#hand .card[data-act="play"]')].map(el => ({r:el.getBoundingClientRect(), h:el.outerHTML, c:el.dataset.c}));
      act({a:'all', s});
      cards.forEach((c, k) => setTimeout(() => flyGhost(c.h, c.r, playTarget(s, c.c)), k * 60));
      break;
    }
    case 'champ': case 'sac': {
      const cs = b.dataset.s != null ? +b.dataset.s : s, CS = pv && pv.seats[cs];
      if(!CS) return;
      if(!mySeats().includes(cs)){ toast(`Ce serviteur appartient à ${CS.n} : c'est à lui ou elle de l'activer.`); return; }
      if(CS.rd){ toast('Tu as terminé ton tour. Touche « Annuler » pour rejouer.'); return; }
      if(A === 'champ' && CS.champ[+b.dataset.i] && CS.champ[+b.dataset.i].lk){ toast('Ce serviteur est enserré ⛓ : il ne peut pas agir ce tour.'); return; }
      if(A === 'champ' && CS.champ[+b.dataset.i] && CS.champ[+b.dataset.i].u){ toast('Ce serviteur a déjà agi ce tour.'); return; }
      if(A === 'champ' && CS.champ[+b.dataset.i] && CARDS[CS.champ[+b.dataset.i].c].up && CS.g < CARDS[CS.champ[+b.dataset.i].c].up){ toast(`Le Bonhomme de cire doit manger ${CARDS[CS.champ[+b.dataset.i].c].up} 🕯️ pour agir. Sans bougies, il fondra à la fin du tour.`); return; }
      act({a:A, s:cs, i:+b.dataset.i}); break;
    }
    case 'atk': if(S && (pv.sub || !busy())){
      const E = pv.en[+b.dataset.e];
      if(E && E.cap && E.tk >= E.cap){ toast(`La carapace de corail tient bon : le Titan ne perdra plus de vie ce tour (${E.cap} max par tour).`); return; }
      if(E && E.inv){ toast(`${FOES[E.t].the || FOES[E.t].n} a plongé : impossible de le toucher ce tour. Prépare plutôt ta protection !`); return; }
      if(E && !FOES[E.t].guard && pv.en.some(o => o.hp > 0 && FOES[o.t].guard)){ toast('Protégé par ses gardiens 🛡 : élimine-les d\'abord.'); return; }
      if(!pv.sub){ toast("L'attaque vient après : quand tout l'équipage a terminé, le capitaine répartit le ⚔ du navire entre les menaces."); return; }
      if(!mySeats().includes(pv.cps)){ toast(`C'est ${esc(pv.seats[pv.cps].n)} qui répartit l'attaque.`); return; }
      if(pv.atk <= 0){ toast("Plus d'attaque ⚔ à répartir ce tour."); return; }
      act({a:'atk', s:pv.cps, e:+b.dataset.e}); } break;
    case 'eatk': {
      const left = pv.atk > 0 && pv.en.some(e => e.hp > 0 && !e.inv && !(e.cap && e.tk >= e.cap));
      if(left && !ui.confirm){ ui.confirm = true; toast(`Il reste ${pv.atk} ⚔ inutilisés. Touche encore pour finir quand même.`); render(); clearTimeout(ui.confirmT); ui.confirmT = setTimeout(() => { ui.confirm = false; if(pv && pv.phase === 'fight') render(); }, 4000); return; }
      ui.confirm = false; act({a:'eatk'}); break;
    }
    case 'buy': {
      if(!S || busy()) return; const m = +b.dataset.m, code = pv.mk[m];
      if(S.g + (S.rb || 0) < CARDS[code].$){ toast(`Il te faut ${Math.max(0, CARDS[code].$ - (S.rb || 0))} 🕯️ pour atteindre cette caisse : elle est trop loin dans le noir.`); return; }
      const from = b.getBoundingClientRect(), html = b.outerHTML;
      act({a:'buy', s, m});
      flyGhost(html, from, '#pile');
      break;
    }
    case 'ecl': if(S && !busy()) act({a:'ecl', s}); break;
    case 'ready': {
      const mine = mySeats(), all = mine.every(i => pv.seats[i].rd);
      if(!all && pv.phase === 'port'){
        const none = mine.filter(i => !pv.seats[i].ab && pv.port && pv.port.pick[i] < 0);
        const k = pv.port && pv.port.k, msg = k === 'port' ? "Pas de récompense choisie. Touche encore « Lever l'ancre » pour partir sans."
          : pv.port.e === 'storm' ? "Pas de choix : tu tiendras la barre. Touche encore « Lever l'ancre » pour confirmer." : "Pas de choix : tu passes ton chemin. Touche encore « Lever l'ancre » pour confirmer.";
        if(none.length && !ui.confirm){ ui.confirm = true; toast(msg); setTimeout(() => ui.confirm = false, 4000); return; }
      }
      else if(!all){
        const left = mine.filter(i => leftToPlay(pv.seats[i]));
        if(left.length && !ui.confirm){ ui.confirm = true; toast("Il te reste des cartes, du combat ou des serviteurs à utiliser."); render(); clearTimeout(ui.confirmT); ui.confirmT = setTimeout(() => { ui.confirm = false; if(pv && pv.phase === 'fight' && !ui.playing) render(); }, 4000); return; }
      }
      ui.confirm = false;
      mine.forEach(i => { if(!pv.seats[i].ab && !!pv.seats[i].rd === all) act({a:'rdy', s:i, v:!all}); });
      break;
    }
    case 'deck-f': ui.deckF = b.dataset.f; if(ui.coach >= 0) render(); else renderSheet(); { const n = $('#sheet .scroll'); if(n) n.scrollTop = 0; } break;
    case 'deck': if(ui.deckOpen == null) ui.deckF = 'all'; ui.deckOpen = +b.dataset.s; if(ui.coach >= 0) render(); else renderSheet(); break;
    case 'deck-close': if(ev.target === b || b.classList.contains('close')){ ui.deckOpen = null; if(ui.coach >= 0) render(); else renderSheet(); } break;
    case 'coach-next': { const SC = coachScript(), st = SC && SC[ui.coach]; if(st && st.close) ui.deckOpen = null; ui.coach++; render(); break; }
    case 'tip-ok': { const d = $('#tipcard'); if(d){ ui.tipsSeen.add(d.dataset.k); try{ localStorage.setItem('cap-tips', JSON.stringify([...ui.tipsSeen])); }catch(e){} d.remove(); } renderTip(); break; }
    case 'coach-skip': ui.coach = -1; ui.coachTarget = null; placeCoachArrow(null); render(); toast('Tutoriel masqué. Achève le requin pour voir la suite.'); break;
  }
});
addEventListener('resize', () => { const d = $('#dock'); if(d && !d.hidden) document.body.style.setProperty('--dockh', (d.offsetHeight + 16) + 'px'); });
render();
initRoom();
