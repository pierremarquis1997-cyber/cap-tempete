<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cap Tempête</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#0a1c26; --sea:#0f2b38; --sea-2:#143847; --deck:#1a4251; --ink:#eef3ee; --muted:#9cb6b8; --line:rgba(226,214,178,.18);
  --brass:#d9a441; --brass-dk:#6b4a10; --coral:#e0573f; --verdigris:#4fb3a0; --spray:#d4ecf0;
  --parch:#efe3c4; --parch-2:#dfcd9f; --parch-ink:#2b2317; --parch-line:rgba(90,62,24,.35);
  --wood:#6a4326; --wood-dk:#2e1c0f; --prot:#7cc4ee;
  --fF:#d9a441; --fM:#4d9ad6; --fC:#9b6fd0; --fT:#4fae66; --neutral:#6f959c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --abyss:#08171f; } }
:root[data-theme="dark"]{ --abyss:#08171f; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--abyss); color:var(--ink);
  background-image:radial-gradient(120% 60% at 50% -10%, #245566 0%, var(--sea) 45%, var(--abyss) 100%); background-attachment:fixed;
  font-family:"Barlow", "Segoe UI", system-ui, sans-serif; font-size:15px; line-height:1.4; -webkit-tap-highlight-color:transparent; }
button{ font-family:inherit; cursor:pointer; color:inherit; }
button:focus-visible, input:focus-visible{ outline:3px solid var(--brass); outline-offset:2px; }
.display{ font-family:"Pirata One", "Palatino Linotype", Georgia, serif; font-weight:400; letter-spacing:.01em; }
#app{ max-width:720px; margin:0 auto; padding:10px 12px 20px; display:flex; flex-direction:column; gap:12px; }
body.docked #app{ padding-bottom:var(--dockh, 280px); }

/* ---------- the sea scene: the one bold element ---------- */
.scene{ position:relative; height:clamp(220px, 58vw, 290px); border-radius:18px; overflow:hidden; isolation:isolate;
  background:linear-gradient(#1d4a5c 0%, #2f6e7c 42%, #3f8791 58%, #1a4a57 59%, #0f3140 100%);
  box-shadow:inset 0 0 0 1px var(--line), 0 14px 30px rgba(0,0,0,.35); }
.scene.storm{ background:linear-gradient(#1a2c3a 0%, #34495a 45%, #3e5968 58%, #172c38 59%, #0c2130 100%); }
.scene .glow{ position:absolute; width:120px; height:120px; left:62%; top:-30px; border-radius:50%; background:radial-gradient(#fff6d6 0%, rgba(255,240,200,.35) 35%, transparent 70%); opacity:.55; z-index:0; }
.wave{ position:absolute; left:0; width:200%; height:60px; z-index:1; animation:drift linear infinite; }
.wave.back{ bottom:34%; height:48px; opacity:.55; animation-duration:16s; }
.wave.front{ bottom:-6px; height:78px; z-index:5; animation-duration:9s; animation-direction:reverse; }
@keyframes drift{ to{ transform:translateX(-50%); } }
.ship{ position:absolute; left:3%; bottom:22px; width:40%; max-width:230px; z-index:7; transform-origin:50% 80%;
  translate:0 var(--sink, 0px); animation:rock 6s ease-in-out infinite; }
.ship svg{ width:100%; height:auto; display:block; filter:drop-shadow(0 6px 4px rgba(0,0,0,.35)); }
@keyframes rock{ 0%,100%{ rotate:calc(var(--tilt, 0deg) - 2.5deg); } 50%{ rotate:calc(var(--tilt, 0deg) + 2.5deg); } }
.ship .cracks{ opacity:0; transition:opacity .4s; }
.ship.damaged .cracks{ opacity:1; }
.ship .ward{ position:absolute; inset:-8% -6% 8% -6%; border-radius:50% 50% 45% 45%; border:3px solid rgba(124,196,238,.0); box-shadow:0 0 0 0 rgba(124,196,238,0); transition:all .35s; pointer-events:none; }
.ship.shielded .ward{ border-color:rgba(124,196,238,.7); box-shadow:0 0 22px 4px rgba(124,196,238,.35), inset 0 0 18px rgba(124,196,238,.25); }
.ship.hit{ animation:rock 6s ease-in-out infinite, jolt .5s; }
@keyframes jolt{ 20%{ transform:translateX(-8px) rotate(-5deg); } 50%{ transform:translateX(6px) rotate(3deg); } }
.splash{ position:absolute; z-index:6; width:90px; height:60px; pointer-events:none; }
.splash i{ position:absolute; bottom:0; width:8px; height:8px; border-radius:50%; background:var(--spray); animation:spray .8s ease-out forwards; }
@keyframes spray{ to{ transform:translate(var(--dx), var(--dy)); opacity:0; } }

.hullbox{ position:absolute; left:12px; top:12px; right:12px; z-index:7; display:flex; align-items:center; gap:8px; }
.hbar{ flex:0 1 260px; height:16px; border-radius:9px; background:rgba(10,20,26,.6); border:2px solid rgba(0,0,0,.45); overflow:hidden; }
.hbar i{ display:block; height:100%; background:linear-gradient(90deg, #8c5a31, #c48a4f); border-radius:9px; transition:width .5s cubic-bezier(.3,1.4,.5,1); }
.hlabel{ font-weight:700; font-size:13px; text-shadow:0 1px 2px #000; white-space:nowrap; }
.shipatk{ position:absolute; z-index:4; left:calc(50% + clamp(40px, 11vw, 50px)); top:16%; translate:-50% -30%; min-width:34px; padding:3px 7px; border-radius:20px; font:800 14px/1.2 var(--ui, system-ui); color:#fff; background:#b8432f; border:2px solid #ffd6c8; box-shadow:0 2px 6px rgba(0,0,0,.4); text-align:center; transition:transform .2s; }
.shipatk.zero{ opacity:.45; }
.shipatk.on{ animation:atkpulse 1.2s ease-in-out infinite; background:#d8532f; }
@keyframes atkpulse{ 50%{ transform:scale(1.12); box-shadow:0 0 14px rgba(255,140,90,.8); } }
.ready.atkend{ background:linear-gradient(#e0673f, #b8432f); color:#fff; }
.shipshield{ position:absolute; z-index:4; left:50%; top:6%; translate:-50% -30%; width:clamp(34px, 9vw, 42px); height:clamp(38px, 10vw, 47px); display:grid; place-items:center; padding-bottom:3px;
  font-weight:800; font-size:clamp(15px, 4.2vw, 18px); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6);
  background:linear-gradient(#9fd8ff, #3f8fcb 55%, #1d5b8a); clip-path:polygon(50% 0, 100% 13%, 100% 56%, 50% 100%, 0 56%, 0 13%);
  filter:drop-shadow(0 0 8px rgba(124,196,238,.8)); transition:filter .3s, opacity .3s; }
.shipshield::before{ content:"🛡"; position:absolute; top:3px; font-size:9px; opacity:.85; filter:grayscale(1) brightness(3); }
.shipshield.zero{ background:linear-gradient(#6f8591, #3c4d57 60%, #26343c); filter:none; opacity:.75; }
.shipshield.bump{ animation:bump .45s; }
.shipshield.breach{ background:linear-gradient(#ff9a8a, #d2402c 55%, #7c1a10); filter:drop-shadow(0 0 10px rgba(255,80,50,.9)); opacity:1; animation:breachPulse 1.1s ease-in-out infinite; }
.shipshield.breach::before{ content:"💥"; filter:none; }
@keyframes breachPulse{ 50%{ filter:drop-shadow(0 0 18px rgba(255,80,50,1)); } }
.brchip{ font-size:11.5px; font-weight:700; color:#fff; background:rgba(170,35,20,.85); border:1px solid #ff8a70; border-radius:20px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(255,80,50,.5); animation:breachPulse 1.1s ease-in-out infinite; }
.ship.vuln{ filter:drop-shadow(0 0 14px rgba(255,60,40,.95)); }
@media (max-width:420px){ .brchip{ font-size:10.5px; padding:2px 7px; } }

.foe-row{ position:absolute; left:40%; right:2%; bottom:14px; top:40px; z-index:6; display:flex; justify-content:space-around; align-items:flex-end; pointer-events:none; }
.foe{ pointer-events:auto; position:relative; background:none; border:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:4px; width:min(118px, 48%); animation:bob 3.2s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ translate:0 0; } 50%{ translate:0 -7px; } }
.foe .fi{ font-size:clamp(44px, 12vw, 60px); line-height:1; filter:drop-shadow(0 5px 3px rgba(0,0,0,.4)); transition:transform .15s; }
.foe.boss .fi{ font-size:clamp(64px, 18vw, 92px); }
.foe.can .fi{ filter:drop-shadow(0 0 10px rgba(224,87,63,.9)) drop-shadow(0 5px 3px rgba(0,0,0,.4)); }
.foe.can:active .fi{ transform:scale(.92); }
.foe .intent{ font-size:12px; font-weight:700; line-height:1.2; padding:4px 8px; border-radius:10px; background:var(--parch); color:#7a1d10; box-shadow:0 3px 0 rgba(0,0,0,.3); position:relative; text-align:center; }
.foe .intent::after{ content:""; position:absolute; left:50%; bottom:-5px; translate:-50% 0; border:5px solid transparent; border-bottom:0; border-top-color:var(--parch); }
.foe .intent.calm{ color:#1d4d73; }
.foe .fhpw{ position:relative; width:clamp(92px, 112%, 140px); display:block; }
.foe.boss .fhpw{ width:clamp(110px, 125%, 170px); }
.foe .fhp{ position:relative; display:block; height:18px; border-radius:10px; background:linear-gradient(#1a0f0c, #3a1d17); border:2px solid rgba(12,6,4,.85); box-shadow:0 2px 4px rgba(0,0,0,.45), inset 0 1px 3px rgba(0,0,0,.6); overflow:hidden; }
.foe .fhp i{ position:relative; z-index:1; display:block; height:100%; border-radius:8px 3px 3px 8px; transition:width .35s; background:linear-gradient(#ff8a6a, #e0472f 55%, #b3301d); box-shadow:inset 0 2px 0 rgba(255,255,255,.35); }
.foe .fhp.mid i{ background:linear-gradient(#ffb36a, #f07a2a 55%, #c2551a); }
.foe .fhp.lo i{ background:linear-gradient(#ff6a6a, #d12a2a 55%, #8c1515); animation:lowhp 1s ease-in-out infinite; }
@keyframes lowhp{ 50%{ filter:brightness(1.5); } }
.foe .fhp::after{ content:""; position:absolute; inset:0; z-index:3; pointer-events:none; background:repeating-linear-gradient(90deg, transparent 0 calc(var(--tk) - 1.5px), rgba(0,0,0,.35) calc(var(--tk) - 1.5px) var(--tk)); }
.foe .fhp s{ position:absolute; top:0; bottom:0; z-index:2; text-decoration:none; background:repeating-linear-gradient(-45deg, #fff6d0 0 4px, #ffc94a 4px 8px); animation:dmgprev .9s ease-in-out infinite; }
@keyframes dmgprev{ 50%{ opacity:.45; } }
.foe .fhp em{ position:absolute; inset:0; z-index:4; display:flex; align-items:baseline; justify-content:center; padding-top:2px; font:800 12.5px/1 var(--ui, system-ui); font-style:normal; color:#fff; letter-spacing:.02em; text-shadow:0 0 2px #000, 0 1px 2px #000, 0 0 4px #000; }
.foe .fhp em small{ font-size:9.5px; opacity:.8; margin-left:1px; }
.foe .fhp.shielded{ border-color:#8fd0ff; box-shadow:0 0 8px rgba(124,196,238,.8), inset 0 1px 3px rgba(0,0,0,.6); }
.foe .fhp.jolt{ animation:barjolt .35s; }
@keyframes barjolt{ 20%{ transform:translateX(3px) scaleY(1.15); } 50%{ transform:translateX(-2px); } }
.foe .fblk{ position:absolute; z-index:5; left:-12px; top:50%; translate:0 -50%; font:800 11.5px/1 var(--ui, system-ui); color:#fff; background:linear-gradient(#2f76a8, #1a4a6e); border:2px solid #bfe6ff; border-radius:11px; padding:3px 5px; box-shadow:0 2px 3px rgba(0,0,0,.5); white-space:nowrap; }
.foe .fnum{ font-size:12px; font-weight:700; text-shadow:0 1px 2px #000; }
.foe .traits{ display:flex; gap:2px; justify-content:center; margin-top:-2px; }
.foe .traits i{ cursor:pointer; font-style:normal; font-size:13px; line-height:1; padding:3px 5px; border-radius:7px; background:rgba(10,20,26,.7); border:1px solid rgba(255,214,107,.5); }
.foe.min .traits i{ font-size:11px; padding:2px 4px; }
.foe .traits i:hover{ border-color:var(--brass); background:rgba(40,60,70,.9); }
.foeinfo{ text-align:left; }
.foeinfo .fi-head{ display:flex; gap:12px; align-items:center; margin-bottom:10px; }
.foeinfo .fi-ic{ font-size:38px; line-height:1; }
.foeinfo h3{ margin:0; font-size:20px; } .foeinfo h3 small{ font-size:11px; padding:2px 6px; border-radius:8px; background:#8a2f25; color:#fff; vertical-align:middle; }
.foeinfo .fi-hp{ margin:2px 0 0; color:var(--muted); font-size:13px; }
.foeinfo .fi-int, .foeinfo .fi-role{ margin:6px 0; font-size:14px; line-height:1.4; }
.foeinfo h4{ margin:12px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--brass); }
.foeinfo .fi-list{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.foeinfo .fi-list li{ display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.35; }
.foeinfo .fi-list li > span{ font-size:20px; line-height:1.2; }
.mate.bound{ filter:grayscale(.7) brightness(.8); }
.mate.bound::after{ content:"⛓"; position:absolute; inset:0; display:grid; place-items:center; font-size:calc(var(--ms) * .55); filter:drop-shadow(0 1px 1px #000); }
.foe .atk{ position:absolute; top:46%; left:50%; translate:-50% -50%; z-index:6; font-size:20px; font-weight:800; line-height:1; background:var(--coral); color:#fff; border-radius:22px; padding:8px 14px; border:2px solid #ffe0d4; box-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 16px rgba(255,120,80,.6); cursor:pointer; white-space:nowrap; animation:firepulse 1.1s ease-in-out infinite; }
.foe.min .atk{ font-size:16px; padding:6px 10px; }
.foe .atk:hover, .foe .atk:focus-visible{ background:#ff6a45; outline:none; }
@keyframes firepulse{ 50%{ scale:1.1; box-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 24px rgba(255,140,90,.9); } }
@media (prefers-reduced-motion:reduce){ .foe .atk{ animation:none; } }
.foe.dead{ pointer-events:none; animation:none; }
.foe.gone{ display:none; }
.foe-row.many{ justify-content:flex-end; gap:0; left:37%; }
.foe.min{ order:-1; z-index:2; }
.foe-row.many .foe:not(.min){ order:1; z-index:1; margin-left:-4px; }
.foe-row.many .foe:not(.min) .fi{ transform:translateY(-10px) scale(.92); }
.foe-row.many .foe.boss{ width:min(104px, 44%); }
.foe-row.crowd .foe.min{ width:min(62px, 26%); margin-right:-2px; }
.foe.min{ width:min(76px, 30%); gap:2px; }
.foe.min .fi{ font-size:clamp(28px, 8vw, 38px); position:relative; }
.foe.min .intent{ font-size:10px; padding:3px 5px; }
.foe.min .fnum{ font-size:10.5px; }
.foe.min .fhpw{ width:100%; } .foe-row.crowd .foe.min .fhpw{ width:calc(100% - 4px); }
.foe-row.many .foe:not(.min) .fhpw{ width:calc(100% - 6px); margin-left:6px; } .foe.min .fhp{ height:15px; } .foe.min .fhp em{ font-size:10.5px; } .foe.min .fhp em small{ display:none; } .foe.min .fblk{ font-size:10px; left:-8px; padding:2px 4px; }
.foe-row.crowd .foe.boss .fi{ font-size:clamp(54px, 15vw, 80px); }
.foe .fi{ position:relative; }
.fbadge2{ position:absolute; right:-8px; bottom:-2px; font-size:14px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:#1d3b4d; border:2px solid #9fd8ff; box-shadow:0 2px 0 rgba(0,0,0,.4); }
.fbadge2.s{ border-color:#ffd66b; background:#4d3b1d; }
.foe.guarded .fi{ filter:grayscale(.3) drop-shadow(0 0 10px rgba(124,196,238,.9)); }
.gshield{ position:absolute; inset:-10%; border-radius:50%; border:3px solid rgba(159,216,255,.8); box-shadow:0 0 16px rgba(124,196,238,.7), inset 0 0 14px rgba(124,196,238,.4); pointer-events:none; animation:breachPulse 1.6s ease-in-out infinite; }
.foe.dived .fi{ opacity:.35; transform:translateY(22px) scale(.8); filter:blur(1px); transition:all .6s; }
.foe.raged .fi{ filter:drop-shadow(0 0 12px rgba(255,60,40,.95)) saturate(1.4); }
.foe.spawn .fi{ animation:spawnIn .8s cubic-bezier(.3,1.5,.5,1); }
@keyframes spawnIn{ from{ transform:translateY(40px) scale(.2); opacity:0; } }
.pool .debt{ font-size:11px; font-weight:800; color:#ff9d8a; margin-left:3px; }
.escchip{ font-size:11.5px; font-weight:700; color:#fff; background:rgba(120,60,20,.85); border:1px solid #ffb36b; border-radius:20px; padding:2px 9px; white-space:nowrap; }
.rbchip{ font-size:12px; font-weight:800; color:#2a1b03; background:#ffe39a; border-radius:10px; padding:2px 8px; white-space:nowrap; }
.halfchip{ font-size:11.5px; font-weight:700; color:#062019; background:#7fe0cf; border-radius:20px; padding:2px 9px; white-space:nowrap; }
.winflag{ position:absolute; z-index:9; left:50%; top:42%; translate:-50% -50%; display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none; animation:winIn .6s cubic-bezier(.3,1.5,.5,1); }
.winflag b{ font-family:"Pirata One", Georgia, serif; font-weight:400; font-size:clamp(34px, 10vw, 52px); color:#ffe39a; text-shadow:0 3px 0 #6a4326, 0 0 24px rgba(255,210,110,.7); }
.winflag span{ font-weight:700; color:#9ff0b0; text-shadow:0 1px 2px #000; }
@keyframes winIn{ from{ transform:scale(.4); opacity:0; } }
.voyfx{ position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:16px; background:radial-gradient(ellipse at 50% 35%, #285a6e, #08161e 70%); opacity:0; transition:opacity .35s; cursor:pointer; }
.voyfx.on{ opacity:1; } .voyfx.off{ opacity:0; }
.voyfx .vbox{ width:min(100%, 460px); display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; color:var(--ink); }
.voyfx .vep{ font-family:"Pirata One", Georgia, serif; font-size:clamp(30px, 9vw, 42px); color:var(--brass); line-height:1.05; animation:winIn .7s cubic-bezier(.3,1.4,.5,1); }
.voyfx .vep small{ display:block; margin-top:6px; font-family:"Barlow", system-ui, sans-serif; font-size:14px; color:var(--muted); }
.voyfx .vep.sm{ font-size:20px; color:var(--muted); animation:none; }
.voyfx .vmap{ position:relative; width:100%; height:64px; }
.voyfx .vline{ position:absolute; left:4%; right:4%; top:50%; border-top:3px dashed rgba(217,164,65,.55); }
.voyfx .vmap i{ position:absolute; top:50%; translate:-50% -50%; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:16px; background:var(--sea-2); border:2px solid var(--line); }
.voyfx .vmap i.done{ background:var(--verdigris); color:#062019; border-color:transparent; font-weight:800; }
.voyfx .vmap i.next{ border-color:var(--brass); box-shadow:0 0 16px -2px var(--brass); animation:breachPulse 1.2s ease-in-out infinite; }
.voyfx .vmap i.port{ translate:-100% -50%; }
.voyfx .vship{ position:absolute; top:-6px; left:var(--x0); margin-left:-17px; font-size:30px; filter:drop-shadow(0 3px 3px rgba(0,0,0,.5)); animation:sailTo 1.9s .25s cubic-bezier(.45,0,.3,1) forwards, bob 1.2s ease-in-out infinite; }
@keyframes sailTo{ to{ left:var(--x1); } }
.voyfx .vdest{ display:flex; flex-direction:column; align-items:center; gap:4px; animation:winIn .6s .9s both; }
.voyfx .vdest .vic{ font-size:40px; line-height:1; }
.voyfx .vdest b{ font-family:"Pirata One", Georgia, serif; font-weight:400; font-size:clamp(26px, 8vw, 34px); }
.voyfx .vdest small{ color:var(--muted); font-size:14px; }
.voyfx .vhull{ font-size:13px; font-weight:700; color:#cfe3c4; }
.voyfx .vmk{ font-size:14px; color:#ffe7a8; background:rgba(217,164,65,.14); border:1px solid rgba(217,164,65,.5); border-radius:12px; padding:7px 12px; animation:fadeUp .6s .5s both; }
.voyfx .vmk b{ color:#ffd66b; }
.voyfx .vmk-ic{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px; margin-top:6px; font-size:20px; }
.voyfx .vmk-ic i{ font-style:normal; }
.voyfx .vskip{ font-size:12px; color:var(--muted); opacity:.7; }
.scene.arrive .foe .fi{ animation:riseIn 1s cubic-bezier(.3,1.3,.5,1) both; }
.scene.arrive .foe .intent, .scene.arrive .foe .fhpw, .scene.arrive .foe .fnum{ animation:fadeUp .6s .6s both; }
.scene.arrive .ship{ animation:sailIn 1s cubic-bezier(.3,1,.4,1); }
@keyframes riseIn{ from{ transform:translateY(60px) scale(.6); opacity:0; } }
@keyframes fadeUp{ from{ transform:translateY(8px); opacity:0; } }
@keyframes sailIn{ from{ translate:-60px 0; opacity:.3; } }
.mutiny{ margin:0 0 8px; font-size:13px; font-weight:700; color:#ffb3a6; background:rgba(160,40,25,.25); border:1px solid rgba(255,120,90,.5); border-radius:10px; padding:6px 10px; }
.locroles{ display:flex; flex-direction:column; gap:8px; margin:10px 0; }
.locrole{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; background:var(--sea-2); border:2px solid transparent; }
.locrole.me{ border-color:var(--rc); background:color-mix(in srgb, var(--rc) 16%, var(--sea-2)); }
.locrole.off{ opacity:.6; }
.locrole .lh{ flex:1; min-width:0; display:grid; grid-template-columns:auto 1fr; column-gap:6px; align-items:center; }

.lobroles{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

.lobrole .ri{ font-size:22px; line-height:1; } .lobrole b{ color:var(--rc); } .lobrole .who{ font-size:12.5px; color:var(--muted); }
.lobrole.mine{ border-color:var(--rc); background:color-mix(in srgb, var(--rc) 18%, var(--sea-2)); } .lobrole.mine .who{ color:#fff; font-weight:700; }

.subh{ font-family:"Barlow", system-ui, sans-serif; font-size:14px; font-weight:700; color:var(--muted); margin:14px 0 6px; }
.bigbtn.coll{ border-color:color-mix(in srgb, var(--brass) 70%, transparent); }

.badge, .beast{ position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:3px; padding:10px 8px; border-radius:12px; background:var(--sea-2); border:1px solid var(--line); }

.badge:not(.on) .bi{ filter:grayscale(1) opacity(.45); } .badge:not(.on) b{ color:var(--muted); }
.badge.on{ border-color:var(--brass); background:linear-gradient(160deg, color-mix(in srgb, var(--brass) 22%, var(--sea-2)), var(--sea-2)); box-shadow:0 0 14px -4px var(--brass); }
.badge .bar{ width:80%; height:6px; border-radius:4px; background:rgba(0,0,0,.4); overflow:hidden; margin-top:4px; } .badge .bar i{ display:block; height:100%; background:var(--brass); }

.badge, .beast{ cursor:pointer; }

.cm-box{ position:relative; width:min(100%, 420px); max-height:calc(100vh - 32px); overflow:auto; padding:18px 18px 16px; border-radius:16px; background:var(--sea); border:1px solid var(--line); box-shadow:0 20px 50px rgba(0,0,0,.6); text-align:center; }

.cm-box h4{ margin:12px 0 4px; font-size:13px; color:var(--muted); text-align:left; }
.cm-box .acts{ text-align:left; margin:0; padding-left:22px; font-size:13.5px; line-height:1.5; }
.cm-box .bar.wide{ display:block; width:80%; height:8px; margin:8px auto 0; border-radius:5px; background:rgba(0,0,0,.4); overflow:hidden; } .cm-box .bar.wide i{ display:block; height:100%; background:var(--brass); }
.cm-box .stamp2{ display:inline-block; margin-top:10px; padding:4px 12px; border-radius:10px; font-size:13px; font-weight:700; background:var(--sea-2); color:var(--muted); }
.cm-box .stamp2.on{ background:color-mix(in srgb, var(--brass) 25%, var(--sea-2)); color:#ffe39a; } .cwrap.seen .card{ filter:saturate(.35) brightness(.85); }
.cwrap .stamp{ position:absolute; z-index:5; right:-4px; top:-8px; white-space:nowrap; font-size:10.5px; font-weight:800; color:#062019; background:var(--verdigris); border-radius:8px; padding:1px 7px; }
.card.cardback{ display:grid; place-items:center; background:repeating-linear-gradient(45deg, #1d3b4d, #1d3b4d 8px, #173243 8px, #173243 16px); border:2px solid var(--line); }
.card.cardback span{ font-size:34px; color:var(--muted); font-weight:800; }
.trophy-pop{ position:fixed; z-index:90; left:50%; top:14px; translate:-50% 0; display:flex; align-items:center; gap:10px; padding:10px 16px 10px 12px; border-radius:14px; background:linear-gradient(160deg, #3a2a0a, #1b140a); color:#fff; border:2px solid var(--brass); box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 24px -4px var(--brass); animation:winIn .6s cubic-bezier(.3,1.5,.5,1); transition:opacity .4s, transform .4s; }
.trophy-pop .ti{ font-size:32px; } .trophy-pop small{ display:block; font-size:11px; color:var(--brass); font-weight:700; } .trophy-pop b{ font-size:15px; }
.trophy-pop.out{ opacity:0; transform:translateY(-20px); }
.tipcard{ position:fixed; z-index:60; left:50%; bottom:calc(var(--dockh, 200px) + 10px); translate:-50% 0; width:min(92vw, 420px); background:var(--parch); color:var(--parch-ink); border-radius:14px; padding:12px 14px 10px; box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 2px var(--brass); font-size:14px; line-height:1.4; animation:bump .4s; }
.tipcard b.h{ display:block; font-family:"Pirata One", Georgia, serif; font-weight:400; font-size:20px; margin-bottom:2px; }
.tipcard .row{ display:flex; justify-content:flex-end; margin-top:8px; }
.tipcard button{ border:none; border-radius:10px; padding:6px 14px; font-weight:700; background:var(--wood-dk, #2e1c0f); color:#fff4d0; cursor:pointer; }
.foe.dead > *{ opacity:0; }
.foe.hit .fi{ animation:foehit .45s; }
@keyframes foehit{ 15%{ transform:translateX(8px) rotate(8deg); filter:brightness(2.2) sepia(1) saturate(4) hue-rotate(-20deg); } 60%{ transform:translateX(-4px); } }
.foe.sinking{ animation:sink 1.1s ease-in forwards; pointer-events:none; }
.foe.sinking > *{ opacity:1; }
@keyframes sink{ 30%{ rotate:-12deg; } to{ translate:0 90px; rotate:25deg; opacity:0; } }
.slash{ position:absolute; z-index:8; width:90px; height:6px; border-radius:3px; background:linear-gradient(90deg, transparent, #fff, transparent); rotate:-35deg; pointer-events:none; animation:slash .35s ease-out forwards; }
@keyframes slash{ from{ scale:0 1; opacity:1; } to{ scale:1.3 1; opacity:0; } }
/* cannon fire */
.cball{ position:fixed; left:0 !important; top:0 !important; z-index:57; width:15px; height:15px; margin:-7.5px 0 0 -7.5px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 35% 30%, #9aa0a4, #2a2d30 55%, #0c0d0e); box-shadow:0 0 8px 2px rgba(255,150,60,.75); }
.trail{ position:fixed; z-index:56; width:9px; height:9px; margin:-4.5px 0 0 -4.5px; border-radius:50%; pointer-events:none; background:rgba(235,238,240,.7); filter:blur(1.5px); animation:trail .45s ease-out forwards; }
@keyframes trail{ to{ scale:2.4; opacity:0; } }
.muzzle{ position:fixed; z-index:57; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, #fffbe0 0, #ffd36b 22%, rgba(255,120,40,.85) 45%, rgba(255,80,20,0) 70%); animation:muzzle .36s ease-out forwards; }
@keyframes muzzle{ from{ scale:.25; opacity:1; } 35%{ scale:1.1; opacity:1; } to{ scale:1.5; opacity:0; } }
.smoke{ position:fixed; z-index:56; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; pointer-events:none; background:rgba(225,230,234,.8); filter:blur(3px); opacity:0; animation:smoke 1s ease-out forwards; }
@keyframes smoke{ from{ transform:translate(0, 0) scale(.4); opacity:.95; } to{ transform:translate(var(--dx), var(--dy)) scale(2.4); opacity:0; } }
.boom{ position:fixed; z-index:57; width:0; height:0; pointer-events:none; }
.boom .core{ position:absolute; left:-40px; top:-40px; width:80px; height:80px; border-radius:50%; background:radial-gradient(circle, #fff 0, #ffe690 22%, #ff8a3a 48%, rgba(210,50,20,0) 72%); animation:bcore .5s ease-out forwards; }
.boom.big .core{ left:-58px; top:-58px; width:116px; height:116px; }
@keyframes bcore{ from{ scale:.2; opacity:1; } 45%{ scale:1.1; opacity:1; } to{ scale:1.4; opacity:0; } }
.boom .ring{ position:absolute; left:-36px; top:-36px; width:72px; height:72px; border-radius:50%; border:4px solid #ffd27a; animation:bring .55s ease-out forwards; }
.boom.big .ring{ left:-50px; top:-50px; width:100px; height:100px; border-width:5px; }
@keyframes bring{ from{ scale:.2; opacity:1; } to{ scale:1.9; opacity:0; border-width:1px; } }
.boom i{ position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:#ffd06a; box-shadow:0 0 6px #ff8a3a; animation:spark .6s ease-out forwards; }
.boom b{ position:absolute; left:-4px; top:-2px; width:9px; height:4px; border-radius:1px; background:#6b4423; animation:chip .8s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes spark{ to{ transform:translate(var(--dx), var(--dy)) scale(.25); opacity:0; } }
@keyframes chip{ 0%{ transform:none; opacity:1; } 40%{ transform:translate(calc(var(--dx) * .6), -30px) rotate(calc(var(--r) * .5)); } to{ transform:translate(var(--dx), var(--dy)) rotate(var(--r)); opacity:0; } }
.dmgpop{ position:fixed; z-index:59; pointer-events:none; translate:-50% -50%; white-space:nowrap; font-family:"Pirata One", Georgia, serif; font-size:50px; line-height:1; color:#ffe3d8;
  -webkit-text-stroke:2px #7a1208; paint-order:stroke fill; text-shadow:0 3px 0 #000, 0 0 16px rgba(255,80,40,.85); animation:dmgpop 1.15s cubic-bezier(.2,1.5,.4,1) forwards; }
.dmgpop.crit{ font-size:64px; color:#fff2a8; text-shadow:0 3px 0 #000, 0 0 22px rgba(255,170,40,1); }
.dmgpop.blk{ font-size:26px; color:#d8efff; -webkit-text-stroke:1px #123a55; text-shadow:0 2px 0 #000; }
@keyframes dmgpop{ 0%{ transform:scale(.2); opacity:0; } 16%{ transform:scale(1.35); opacity:1; } 32%{ transform:scale(1); } 72%{ transform:translateY(-24px); opacity:1; } to{ transform:translateY(-44px) scale(.9); opacity:0; } }
.foe.hit2 .fi{ animation:foehit2 .6s ease-out; }
@keyframes foehit2{
  0%{ transform:none; }
  10%{ transform:translate(16px, -5px) rotate(15deg) scale(.88); filter:brightness(3) sepia(1) saturate(6) hue-rotate(-30deg) drop-shadow(0 0 12px #ff3a1a); }
  28%{ transform:translate(-9px, 2px) rotate(-9deg) scale(1.04); filter:brightness(1.6) sepia(1) saturate(4) hue-rotate(-30deg); }
  48%{ transform:translate(5px, 0) rotate(4deg); filter:none; }
  68%{ transform:translate(-2px, 0) rotate(-1deg); }
  100%{ transform:none; } }
.foe .fhp b.gh{ position:absolute; z-index:0; left:0; top:0; bottom:0; background:#fff0c4; border-radius:8px; }

/* ---------- chrome ---------- */
.topline{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.topline .zone{ flex:1; min-width:0; }
@media (max-width:440px){ .topline{ gap:8px; } .topline .zone{ font-size:clamp(18px, 5.2vw, 24px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .topline .zone .epb{ display:table; margin:4px 0 0; } .topline .route i{ width:20px; height:20px; font-size:10px; } .topline .route b{ width:4px; } }
.qbtn{ flex:none; align-self:flex-start; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:18px; line-height:1; cursor:pointer; color:var(--parch); background:rgba(10,20,26,.55); border:1px solid var(--line); }

.quitbox p{ margin:6px 0; line-height:1.4; color:var(--ink); }
.quitbox .row{ display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
.quitbox .row .btn{ flex:1; min-width:130px; }
.btn.danger{ background:#b8432f; color:#fff; box-shadow:0 4px 0 #7a2a1c; }
.zone{ font-size:clamp(22px, 6vw, 28px); line-height:1; color:var(--parch); }
@media (max-width:420px){ .route i{ width:20px; height:20px; font-size:10px; } .route b{ width:5px; } }
.route{ display:flex; align-items:center; }
.route i{ font-style:normal; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; background:var(--sea-2); border:1px solid var(--line); opacity:.5; }
.route b{ width:10px; height:2px; background:var(--line); }
.route i.done{ opacity:.9; background:var(--verdigris); color:#062019; border-color:transparent; font-size:11px; }
.route i.now{ opacity:1; border:2px solid var(--brass); box-shadow:0 0 12px rgba(217,164,65,.6); }

.crew{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; scroll-snap-type:x proximity; }
.crew > .seat{ scroll-snap-align:start; }
/* slim scrollbars in the colours of the game, everywhere (no grey arrows) */
*{ scrollbar-width:thin; scrollbar-color:color-mix(in srgb, var(--brass) 55%, transparent) transparent; }
::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:color-mix(in srgb, var(--brass) 50%, transparent); border-radius:6px; }
::-webkit-scrollbar-thumb:hover{ background:var(--brass); }
::-webkit-scrollbar-button{ display:none; width:0; height:0; }
::-webkit-scrollbar-corner{ background:transparent; }
.seat{ flex:1 0 auto; min-width:126px; background:var(--sea-2); border:1px solid var(--line); border-radius:12px; padding:7px 10px; text-align:left; position:relative; overflow:hidden; }
.seat::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--rc); }
.seat .tl{ display:flex; justify-content:space-between; gap:6px; font-weight:700; }
.seat .who{ color:var(--rc); }
.seat .st{ font-size:12.5px; color:var(--muted); display:flex; gap:9px; margin-top:1px; }
.seat.active{ background:color-mix(in srgb, var(--rc) 20%, var(--sea-2)); border-color:var(--rc); }
.seat.away{ opacity:.45; }
.ok{ color:var(--verdigris); font-size:13px; }

.sect{ background:linear-gradient(var(--deck), var(--sea-2)); border-radius:16px; padding:12px 12px 10px; border:1px solid var(--line); }
.sect > header{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.sect h2{ font-family:"Pirata One", Georgia, serif; font-weight:400; font-size:24px; margin:0; line-height:1; color:var(--parch); }
.note{ font-size:12.5px; color:var(--muted); }
/* the dark hold: what your candles reach is lit, the rest stays in the shadows */
#market{ position:relative; overflow:hidden; border-color:#3a2a18;
  background:radial-gradient(120% 90% at 50% 0%, rgba(255,190,90,.16), transparent 60%), repeating-linear-gradient(90deg, #1b130c 0 38px, #17100a 38px 40px), #140e08; }
#market::before{ content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(140% 100% at 50% 110%, rgba(0,0,0,.6), transparent 60%); }
#market > *{ position:relative; }
#market h2{ color:#ffe6b0; text-shadow:0 0 12px rgba(255,170,60,.45); }
#market h2::before{ content:"🏮"; font-size:20px; margin-right:6px; display:inline-block; transform-origin:50% 0; animation:lanternsway 3.2s ease-in-out infinite; }
@keyframes lanternsway{ 0%,100%{ rotate:-7deg; } 50%{ rotate:7deg; } }
#market .note{ color:#c9ab80; }
#market .card.off{ opacity:1; filter:brightness(.66) saturate(.5); box-shadow:0 5px 0 rgba(0,0,0,.5); }

#market .card.afford{ filter:none; box-shadow:0 5px 0 rgba(0,0,0,.4), 0 0 0 2px #ffcf7a, 0 0 22px 4px rgba(255,170,60,.55); animation:candleglow 2.4s ease-in-out infinite; }
@keyframes candleglow{ 50%{ box-shadow:0 5px 0 rgba(0,0,0,.4), 0 0 0 2px #ffcf7a, 0 0 28px 7px rgba(255,160,50,.7); } }
#market .legend{ color:#b89a70; }
@media (prefers-reduced-motion:reduce){ #market h2::before, #market .card.afford{ animation:none; } }
.legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:6px; }
.log{ font-size:13px; color:var(--muted); border-left:2px solid var(--brass); padding:2px 0 2px 10px; min-height:22px; }
.log div:last-child{ color:var(--ink); }

/* ---------- cards: framed parchment ---------- */
.cards{ display:flex; gap:9px; overflow-x:auto; padding:16px 4px 8px 12px; scroll-padding-left:12px; scroll-snap-type:x proximity; }
.card{ --fc:var(--neutral); flex:0 0 auto; width:124px; height:178px; padding:4px; border:none; border-radius:12px; position:relative; scroll-snap-align:start; text-align:left; color:var(--parch-ink);
  background:linear-gradient(160deg, color-mix(in srgb, var(--fc) 70%, #fff) 0%, var(--fc) 38%, color-mix(in srgb, var(--fc) 55%, #000) 100%);
  box-shadow:0 5px 0 rgba(0,0,0,.4), 0 10px 18px rgba(0,0,0,.3); transition:transform .15s ease, box-shadow .15s ease; }
.card:hover{ transform:translateY(-4px); box-shadow:0 8px 0 rgba(0,0,0,.35), 0 14px 22px rgba(0,0,0,.3); }
.card:active{ transform:translateY(1px) scale(.98); }
.card .face{ height:100%; border-radius:9px; display:flex; flex-direction:column; overflow:hidden;
  background:radial-gradient(130% 90% at 30% 0%, var(--parch) 0%, var(--parch-2) 100%);
  box-shadow:inset 0 0 0 1px rgba(60,40,10,.35), inset 0 0 16px rgba(120,80,20,.2); }
.card .nm{ font-family:"Pirata One", Georgia, serif; font-weight:400; font-size:15.5px; line-height:1.02; text-align:center; padding:5px 6px 4px; min-height:34px; display:grid; place-items:center; }
.card .art{ position:relative; height:54px; margin:0 5px; border-radius:7px; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--fc) 45%, #fff) 0%, var(--fc) 55%, color-mix(in srgb, var(--fc) 50%, #000) 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), inset 0 -10px 16px rgba(0,0,0,.25); }
.card .art::after{ content:""; position:absolute; inset:0; opacity:.22;
  background:repeating-radial-gradient(circle at 50% 120%, transparent 0 7px, rgba(255,255,255,.8) 7px 8px); }
.card .pic{ position:relative; z-index:1; font-size:34px; line-height:1; filter:drop-shadow(0 3px 2px rgba(0,0,0,.45)); }
.card .fbadge{ position:absolute; z-index:2; top:3px; right:3px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:11px; background:rgba(255,248,230,.9); box-shadow:0 1px 2px rgba(0,0,0,.4); }
.card .kind{ font-size:10.5px; font-style:italic; text-align:center; color:#6a5838; padding:3px 4px 2px; }
.card .body{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:4px; padding:0 6px 4px; }
.fxrow{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px; }
.fx{ display:inline-flex; align-items:center; gap:2px; font-weight:700; font-size:14px; line-height:1; padding:3px 6px; border-radius:7px; background:rgba(60,40,10,.1); white-space:nowrap; }
.fx.g{ color:#7a5304; } .fx.c{ color:#9a2615; } .fx.p{ color:#1d5b8a; } .fx.h{ color:#2c7a3c; } .fx.d{ color:#4a3a78; } .fx.o{ color:#5a4b30; font-size:12.5px; }
.card .when{ font-size:11px; text-align:center; color:#5a4b30; }
.card .ally, .card .sacr{ display:flex; align-items:center; gap:5px; padding:4px 6px; font-size:12px; }
.card .ally{ border-top:1px dashed color-mix(in srgb, var(--fc) 70%, #000); background:color-mix(in srgb, var(--fc) 12%, transparent); }
.card .ally .fx{ background:rgba(255,255,255,.35); }
.card .ally .medal{ flex:none; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:10.5px; background:var(--fc); box-shadow:inset 0 0 0 1px rgba(0,0,0,.3); }
.card .ally.on{ border-top-style:solid; background:color-mix(in srgb, var(--fc) 42%, var(--parch)); }
.card .ally.on .medal{ box-shadow:0 0 0 2px #fff8e0, 0 0 10px 2px var(--fc); animation:allyglow 1.6s ease-in-out infinite; }
@keyframes allyglow{ 50%{ box-shadow:0 0 0 2px #fff8e0, 0 0 3px 0 var(--fc); } }
.card .sacr{ background:rgba(110,30,18,.13); border-top:1px solid rgba(110,30,18,.3); color:#6a1d12; }
.card .sacr .skull{ flex:none; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:11px; background:#6a1d12; color:#fff; }
.card .coin{ position:absolute; z-index:3; top:-10px; left:-8px; height:26px; padding:0 8px 0 4px; border-radius:13px; display:flex; align-items:center; gap:1px; font-weight:800; font-size:15px; line-height:1; color:#ffe9b8;
  background:linear-gradient(#3a2412, #22150a); border:1.5px solid #e9a94f; box-shadow:0 3px 0 rgba(0,0,0,.45), 0 0 10px rgba(255,160,60,.45); }
.card .coin i{ font-style:normal; font-size:14px; }
.card .def{ position:absolute; z-index:2; right:3px; bottom:3px; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:14px; color:#fff; text-shadow:0 1px 1px rgba(0,0,0,.6);
  background:radial-gradient(circle at 35% 30%, #b98553, #7a4b25 60%, #4a2b12); box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 0 0 2px #e8c48a; }
.card .def::before{ content:"déf"; position:absolute; top:50%; right:calc(100% - 3px); translate:0 -50%; font-size:8.5px; font-weight:800; letter-spacing:.3px; color:#4a2b12; background:#f3e3bd; border-radius:5px; padding:0 3px; line-height:11px; text-shadow:none; }
.card .ctx{ display:block; margin:3px 4px 0; font-size:10.5px; font-weight:700; line-height:1.2; text-align:center; color:#5a3f0e; }
.card .ally .ctx{ margin:0; text-align:left; }
.card .bcol{ display:flex; flex-direction:column; align-items:flex-start; gap:1px; min-width:0; }
.card .ally .bl, .card .sacr .bl{ font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; opacity:.7; line-height:1; }
.card .ally, .card .sacr{ padding-top:3px; padding-bottom:3px; }
.card.champ .face{ box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--fc) 60%, #000), inset 0 0 16px rgba(120,80,20,.2); }
.card.champ .kind{ color:color-mix(in srgb, var(--fc) 45%, #2b2317); font-weight:700; font-style:normal; }
.card.junk{ background:linear-gradient(160deg, #9a8e7a, #6e6353); }
.card.junk .face{ background:repeating-linear-gradient(-45deg, #d8cdb5 0 7px, #cbbfa3 7px 14px); }
.card.junk .art{ background:radial-gradient(circle, #b9ab92, #7b6f5c); }
.card.off{ opacity:.5; filter:saturate(.45); }
.card.off:hover{ transform:none; }
.card.deal{ animation:deal .45s cubic-bezier(.2,.9,.3,1.2) backwards; animation-delay:calc(var(--i) * 70ms); }
@keyframes deal{ from{ transform:translateY(100px) rotate(-10deg); opacity:0; } }
.card.flipin{ animation:flipin .55s ease-out; }
@keyframes flipin{ from{ transform:perspective(500px) rotateY(90deg); } }
.card.ghost{ position:fixed; z-index:50; pointer-events:none; margin:0; }
.market .card.afford{ box-shadow:0 5px 0 rgba(0,0,0,.4), 0 0 0 2px var(--brass), 0 0 16px rgba(217,164,65,.45); }

.inplay{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.chip{ display:inline-flex; gap:6px; align-items:center; background:var(--abyss); border:1px solid var(--line); border-left:4px solid var(--fc); border-radius:9px; padding:4px 6px 4px 8px; font-size:13px; animation:pop .3s ease-out backwards; }
.chip.used{ opacity:.55; }
.chip .ck{ color:var(--verdigris); font-size:12px; }
@keyframes pop{ from{ transform:scale(.6); opacity:0; } }

/* ---------- champions standing on the ship ---------- */
.mates{ position:absolute; z-index:7; left:5%; right:5%; bottom:36%; display:flex; flex-wrap:wrap-reverse; justify-content:center; align-content:flex-start; gap:3px 5px; pointer-events:none; --ms:clamp(28px, 8.5vw, 40px); }
.mates.crowd{ --ms:clamp(24px, 7vw, 32px); gap:2px 3px; }
.mates.packed{ --ms:clamp(22px, 6vw, 28px); gap:2px; }
.mate{ pointer-events:auto; position:relative; flex:none; width:var(--ms); height:var(--ms); padding:0; border-radius:50%; border:2px solid var(--oc); display:grid; place-items:center; cursor:pointer;
  background:radial-gradient(circle at 40% 30%, color-mix(in srgb, var(--fc) 40%, #fff), var(--fc) 60%, color-mix(in srgb, var(--fc) 45%, #000));
  box-shadow:0 3px 0 rgba(0,0,0,.4), 0 5px 8px rgba(0,0,0,.35); }
.mate .mp{ font-size:calc(var(--ms) * .56); line-height:1; filter:drop-shadow(0 2px 1px rgba(0,0,0,.45)); }
.mate .md{ position:absolute; right:-7px; bottom:-6px; width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:10.5px; font-weight:800; color:#fff;
  background:radial-gradient(circle at 35% 30%, #b98553, #7a4b25 60%, #4a2b12); box-shadow:inset 0 0 0 1.5px #e8c48a; }
.mate.awake{ animation:hop 2.4s ease-in-out infinite; border-color:#ffe9a8; box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 0 2px var(--brass), 0 0 10px 1px rgba(217,164,65,.65); }
@keyframes hop{ 0%,70%,100%{ transform:translateY(0); } 80%{ transform:translateY(-6px); } 90%{ transform:translateY(0); } }
.mate.used{ filter:grayscale(.85) brightness(.8); }
.mate.used::after{ content:"✓"; position:absolute; top:-7px; left:50%; translate:-50% 0; width:14px; height:14px; border-radius:50%; display:grid; place-items:center; font-size:9px; color:#062019; background:var(--verdigris); filter:none; }
.mate.arrive{ animation:mateIn .7s cubic-bezier(.3,1.5,.5,1); }
@keyframes mateIn{ from{ transform:translateY(-80px) scale(.3) rotate(-30deg); opacity:0; } 60%{ opacity:1; } }
.mate.fire{ animation:matefire .5s ease-out; }
@keyframes matefire{ 30%{ transform:scale(1.35); box-shadow:0 0 0 4px #fff, 0 0 24px 8px var(--fc); } }
.mate-fall{ position:fixed; z-index:57; pointer-events:none; border-radius:50%; display:grid; place-items:center; border:2px solid var(--oc); background:var(--fc); animation:matefall 1s ease-in forwards; }
@keyframes matefall{ 20%{ transform:translate(-10px, -24px) rotate(-40deg); } to{ transform:translate(-50px, 120px) rotate(-220deg); opacity:0; } }

/* ---------- played cards table ---------- */
.tally{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.tpip{ --fc:var(--neutral); display:inline-flex; align-items:center; gap:5px; padding:3px 10px 3px 3px; border-radius:20px; background:var(--abyss); border:1px solid var(--line); font-size:12.5px; color:var(--muted); transition:all .25s; }
.tpip .ic{ width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; background:color-mix(in srgb, var(--fc) 22%, var(--abyss)); }
.tpip b{ color:var(--ink); font-size:14px; }
.tpip .st{ font-size:11.5px; }
.tpip.one{ border-color:color-mix(in srgb, var(--fc) 55%, transparent); border-style:dashed; }
.tpip.on{ border-color:var(--fc); color:var(--ink); background:color-mix(in srgb, var(--fc) 24%, var(--abyss)); box-shadow:0 0 14px -3px var(--fc); }
.tpip.on .ic{ background:var(--fc); box-shadow:0 0 0 2px #fff4d0; }
.tpip.on .st{ font-weight:700; }
.prow{ display:flex; align-items:center; gap:8px; margin-top:8px; padding:2px 0 2px 8px; border-left:3px solid var(--rc); }
.prow .pwho{ flex:none; font-size:18px; width:24px; text-align:center; }
.prow.act{ background:linear-gradient(90deg, color-mix(in srgb, var(--rc) 14%, transparent), transparent 70%); border-radius:0 10px 10px 0; }
.minis{ display:flex; gap:7px; overflow-x:auto; padding:9px 2px 8px; }
.mini{ --fc:var(--neutral); flex:none; position:relative; width:68px; height:86px; padding:2px; border-radius:8px;
  background:linear-gradient(160deg, color-mix(in srgb, var(--fc) 70%, #fff), var(--fc) 40%, color-mix(in srgb, var(--fc) 55%, #000));
  box-shadow:0 3px 0 rgba(0,0,0,.35); animation:minin .35s cubic-bezier(.3,1.4,.5,1) backwards; }
@keyframes minin{ from{ transform:translateY(-14px) scale(.6); opacity:0; } }
.mini .mf{ height:100%; border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:4px 2px 4px; color:var(--parch-ink);
  background:radial-gradient(130% 90% at 30% 0%, var(--parch), var(--parch-2)); }
.mini .pic{ font-size:23px; line-height:1; filter:drop-shadow(0 2px 1px rgba(0,0,0,.35)); }
.mini .mn{ font-size:8.8px; letter-spacing:-.15px; font-weight:700; line-height:1.05; text-align:center; overflow-wrap:anywhere; hyphens:auto; max-width:100%; }
.mini .fxrow{ gap:2px; }
.mini .fx{ font-size:10.5px; padding:1px 3px; border-radius:4px; }
.mini .lk{ position:absolute; top:-8px; right:-7px; width:21px; height:21px; border-radius:50%; display:grid; place-items:center; font-size:11px; background:var(--abyss); border:1.5px dashed var(--fc); }
.mini.linked{ box-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 0 2px #fff4d0, 0 0 16px 2px var(--fc); }
.mini.linked .lk{ background:var(--fc); border:2px solid #fff4d0; }
.mini .sacb{ position:absolute; left:50%; bottom:-10px; translate:-50% 0; display:flex; align-items:center; gap:2px; white-space:nowrap; border:none; border-radius:10px; padding:1px 6px; font-size:11px; font-weight:700; color:#fff; background:#7a2415; box-shadow:0 2px 0 rgba(0,0,0,.4); }
.mini .sacb .fx{ background:rgba(255,255,255,.2); color:#fff; font-size:10px; }
.mini .sacb:disabled{ opacity:.5; }
.pulse{ animation:pulseglow .9s ease-out 2; }
@keyframes pulseglow{ 40%{ transform:scale(1.12); filter:brightness(1.35); } }
.empty{ margin:8px 0 2px; }

/* ---------- phones: bigger ship, lighter dock ---------- */
@media (max-width:540px){
  .scene{ height:clamp(200px, 54vw, 250px); }
  .ship{ width:50%; left:1%; bottom:16px; }
  .foe-row{ left:50%; }
  .mates{ --ms:clamp(30px, 9vw, 38px); left:3%; right:3%; }
  .mates.crowd{ --ms:clamp(24px, 7vw, 30px); }
  .mates.packed{ --ms:clamp(21px, 6vw, 26px); }
  #hand{ padding-top:13px; }
  #hand .card{ width:100px; height:146px; padding:3px; }
  #hand .card .nm{ font-size:13.5px; min-height:28px; padding:4px 4px 3px; }
  #hand .card .art{ height:40px; }
  #hand .card .pic{ font-size:26px; }
  #hand .card .kind{ font-size:10px; padding:2px 3px 1px; }
  #hand .card .fx{ font-size:12.5px; padding:2px 5px; }
  #hand .card .ally, #hand .card .sacr{ padding:3px 4px; gap:4px; }
  .eclat{ padding:4px 10px 4px 4px; gap:8px; }
  .eclat .medal{ width:42px; height:42px; }
  .eclat .emb{ font-size:20px; }
  .eclat .etx b{ font-size:17px; }
  .eclat .etx small{ display:none; }
  .ready{ padding:12px 14px; }
  .tpip{ padding:2px 8px 2px 2px; font-size:12px; }
  .tpip .ic{ width:22px; height:22px; }
}

/* ---------- enemy turn replay ---------- */
body.enemy-turn #app, body.enemy-turn #dock{ pointer-events:none; }
body.enemy-turn #dock .dock-in{ opacity:.4; filter:saturate(.6); transition:opacity .25s; }
.turnflag{ position:absolute; z-index:9; left:50%; top:44px; translate:-50% 0; white-space:nowrap; font-family:"Pirata One", Georgia, serif; font-size:22px; line-height:1;
  color:#7a1d10; background:var(--parch); padding:6px 16px 7px; border-radius:20px; box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 0 2px rgba(224,87,63,.5); animation:flagin .35s cubic-bezier(.3,1.5,.5,1); }
@keyframes flagin{ from{ transform:translateY(-16px) scale(.7); opacity:0; } }
.scene.menace::after{ content:""; position:absolute; inset:0; z-index:8; pointer-events:none; background:radial-gradient(120% 90% at 70% 50%, transparent 40%, rgba(120,20,10,.28)); animation:menace .4s ease-out; }
@keyframes menace{ from{ opacity:0; } }
.foe.acting{ z-index:3; }
.foe.acting .intent{ background:#fff3d6; box-shadow:0 3px 0 rgba(0,0,0,.3), 0 0 0 2px var(--coral), 0 0 14px rgba(224,87,63,.7); transform:scale(1.12); transition:transform .2s; }
.foe.acting .fi{ filter:drop-shadow(0 0 12px rgba(255,120,90,.9)) drop-shadow(0 5px 3px rgba(0,0,0,.4)); }

/* ---------- epics, port, treasures ---------- */
.epb{ display:inline-flex; align-items:center; margin-left:8px; vertical-align:middle; font-family:"Barlow", system-ui, sans-serif; font-size:12px; font-weight:700;
  padding:2px 8px; border-radius:10px; background:var(--sea-2); border:1px solid color-mix(in srgb, var(--brass) 60%, transparent); color:var(--brass); letter-spacing:0; }
.epics{ display:flex; gap:6px; justify-content:center; margin:8px 0 2px; }
.epics i{ font-style:normal; font-size:12px; font-weight:700; padding:3px 10px; border-radius:12px; background:var(--sea-2); border:1px solid var(--line); color:var(--muted); }
.epics i.done{ background:var(--verdigris); color:#062019; border-color:transparent; }
.epics i.now{ border-color:var(--brass); color:var(--ink); box-shadow:0 0 10px -2px var(--brass); }
.porthead h2{ margin-bottom:4px; }
.rewards{ padding-top:14px; }
.card.picked, .relic.picked{ box-shadow:0 0 0 3px #fff4d0, 0 0 0 6px var(--brass), 0 0 24px 4px rgba(217,164,65,.6); transform:translateY(-4px); }
.card.picked::after, .relic.picked::after{ content:"✓"; position:absolute; z-index:4; top:-10px; right:-8px; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-weight:800; color:#2a1b03; background:var(--brass); box-shadow:0 2px 0 rgba(0,0,0,.4); }
.relic{ flex:0 0 auto; position:relative; width:124px; height:178px; border:none; border-radius:12px; padding:4px; text-align:center; color:var(--parch-ink);
  background:linear-gradient(160deg, #fff0b8, #d9a441 45%, #7a5410); box-shadow:0 5px 0 rgba(0,0,0,.4), 0 10px 18px rgba(0,0,0,.3); }
.relic .face{ height:100%; border-radius:9px; display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 8px 8px;
  background:radial-gradient(circle at 50% 30%, #fff8e2, var(--parch) 45%, var(--parch-2)); box-shadow:inset 0 0 0 1px rgba(60,40,10,.35); }
.relic .ric{ width:58px; height:58px; border-radius:50%; display:grid; place-items:center; font-size:32px; background:radial-gradient(circle at 40% 30%, #fff4d0, #e2b04c 60%, #9c6a18); box-shadow:0 3px 0 rgba(0,0,0,.3), 0 0 16px rgba(217,164,65,.6); }
.relic b{ font-family:"Pirata One", Georgia, serif; font-weight:400; font-size:17px; line-height:1; }
.relic span{ font-size:12px; line-height:1.25; }
.relic small{ margin-top:auto; font-size:10.5px; font-style:italic; color:#6a5838; }
.card.leg{ background:linear-gradient(160deg, #fff6c8, #f2c14e 35%, #a0701a 100%); }
.card.leg .face{ box-shadow:inset 0 0 0 1px rgba(60,40,10,.35), inset 0 0 22px rgba(242,193,78,.45); }
.card.leg .art::before{ content:""; position:absolute; inset:-40%; z-index:1; background:conic-gradient(from 0deg, transparent 0 20deg, rgba(255,255,255,.35) 30deg, transparent 40deg 200deg, rgba(255,255,255,.25) 210deg, transparent 220deg); animation:spin 8s linear infinite; }
.card.marked{ filter:grayscale(.6) brightness(.8); }
.mkslot{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px; scroll-snap-align:start; }
.mkrm{ font:inherit; font-size:11.5px; font-weight:700; color:var(--ink); background:rgba(10,20,26,.55); border:1px solid var(--line); border-radius:10px; padding:3px 9px; cursor:pointer; }
.mkrm:disabled{ opacity:.4; cursor:default; }
.mkrm:not(:disabled):active{ transform:translateY(1px); }
.deckbtn .drw{ font-size:11px; font-weight:700; color:var(--muted); margin-left:2px; }
.deckbtn .drw.empty{ color:#ff9d8a; }
.opts{ display:flex; flex-wrap:wrap; gap:14px 12px; justify-content:center; padding:14px 4px 6px; }
.opt{ display:flex; flex-direction:column; align-items:center; gap:7px; width:124px; }
.opt .card{ flex:0 0 auto; }
.opt > small{ font-size:11.5px; line-height:1.25; text-align:center; color:var(--ink); opacity:.9; }
.opt > small .bad{ color:#ff9d8a; font-weight:700; }
.relic.act{ background:linear-gradient(160deg, #d8f0ff, #5fa7d6 45%, #1d4f75); }
.relic.act .ric{ background:radial-gradient(circle at 40% 30%, #eaf7ff, #7cc4ee 60%, #2b6e9c); box-shadow:0 3px 0 rgba(0,0,0,.3), 0 0 16px rgba(124,196,238,.6); }
.relic.act.risk{ background:linear-gradient(160deg, #ffd9cf, #d9674c 45%, #7a2410); }
.relic.act.risk .ric{ background:radial-gradient(circle at 40% 30%, #ffe8e0, #ee8a70 60%, #9c3a22); }
.evhead .evic{ font-size:44px; line-height:1; display:block; margin-bottom:6px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
.pendw{ margin:6px 0 0; font-size:13px; color:#e8c8ff; }
.card .rmb{ position:absolute; z-index:4; top:-9px; left:-7px; min-width:34px; height:26px; padding:0 7px; border-radius:13px; display:grid; place-items:center; font-weight:800; font-size:13px; color:#fff; background:#b0321f; box-shadow:0 2px 0 rgba(0,0,0,.4); }
.relics{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 4px; }
.relchip{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:3px 10px 3px 4px; border-radius:16px; background:color-mix(in srgb, var(--brass) 18%, var(--sea-2)); border:1px solid color-mix(in srgb, var(--brass) 55%, transparent); }
.relchip i{ font-style:normal; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; background:radial-gradient(circle at 40% 30%, #fff4d0, #e2b04c 60%, #9c6a18); }
.seat .rl{ font-size:11px; margin-left:4px; letter-spacing:1px; }
.btn.purgebtn.on{ background:#b0321f; color:#fff; border-color:#b0321f; box-shadow:0 0 12px rgba(255,107,80,.6); }
#hand.purging .card[data-act="play"]{ outline:3px dashed #ff6b50; outline-offset:2px; }
#hand.purging .card[data-act="play"]::after{ content:"🌊"; position:absolute; z-index:5; top:40%; left:50%; translate:-50% -50%; font-size:30px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)); }

/* ---------- dock ---------- *//* ---------- dock ---------- */
.dock{ position:fixed; left:0; right:0; bottom:0; z-index:10; padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(12,33,43,.98), var(--abyss)); border-top:1px solid var(--line); box-shadow:0 -12px 28px rgba(0,0,0,.45); }
.dock-in{ max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:6px; }
.dock-in.compact #hand{ display:none; }
.dock-in.compact .pools [data-act="all"], .dock-in.compact .purgebtn{ display:none; }
.dock-in.compact .eclat{ flex:none; padding:0; gap:0; background:none; border:none; box-shadow:none; }
.dock-in.compact .eclat .etx{ display:none; }
.dock-in.compact .eclat .medal{ width:46px; height:46px; }
.dock-in.compact .eclat-off{ flex:1; }
.dock-in.compact .ready:not(.atkend):not(.atkwait){ flex:1; }
.pools{ display:flex; gap:8px; align-items:center; }
.seatsw{ display:flex; gap:6px; margin:0 0 8px; }
.seatsw button{ flex:1; min-width:0; font:inherit; font-size:13.5px; font-weight:700; padding:7px 8px; border-radius:10px; color:var(--ink); background:var(--sea-2); border:2px solid transparent; box-shadow:0 2px 0 rgba(0,0,0,.35); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; touch-action:manipulation; }
.seatsw button.on{ border-color:var(--rc); background:color-mix(in srgb, var(--rc) 28%, var(--sea-2)); color:#fff; }
.seatsw button.done{ opacity:.7; }
.seatsw button i{ font-style:normal; color:#9ff0b0; }
.seatsw button i.dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--brass); vertical-align:middle; margin-left:3px; box-shadow:0 0 6px var(--brass); }
.pools .who{ font-size:13px; color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pools .btn{ white-space:nowrap; }
@media (max-width:420px){ .pools{ gap:4px; flex-wrap:wrap; justify-content:flex-end; } .pools .who{ display:none; } .pools .btn{ padding:4px 6px; font-size:12px; } .deckbtn{ padding:4px 7px 4px 6px; } .pools [data-act="all"]{ margin-right:auto; } .deckbtn b{ display:none; } .pool{ font-size:16px; padding:2px 9px 2px 3px; gap:4px; } .pool .ico{ width:22px; height:22px; font-size:12px; } }
.pool{ display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:19px; padding:3px 12px 3px 5px; border-radius:20px; background:var(--sea-2); border:1px solid var(--line); }

/* ---------- special skill ---------- */
.eclat{ --rc:#c08a55; flex:1; min-width:0; display:flex; align-items:center; gap:10px; padding:6px 12px 6px 6px; border-radius:40px; text-align:left;
  border:1px solid color-mix(in srgb, var(--rc) 70%, transparent);
  background:linear-gradient(100deg, color-mix(in srgb, var(--rc) 34%, var(--sea-2)), var(--sea-2) 80%); box-shadow:0 4px 0 rgba(0,0,0,.35); }
.eclat .medal{ position:relative; flex:none; width:50px; height:50px; border-radius:50%; display:grid; place-items:center; }
.eclat .medal::before{ content:""; position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg, var(--rc), #fff4d0, var(--rc), color-mix(in srgb, var(--rc) 45%, #000), var(--rc));
  -webkit-mask:radial-gradient(circle, transparent 60%, #000 62%); mask:radial-gradient(circle, transparent 60%, #000 62%); }
.eclat .medal::after{ content:""; position:absolute; inset:5px; border-radius:50%;
  background:radial-gradient(circle at 40% 30%, color-mix(in srgb, var(--rc) 40%, #fff), var(--rc) 55%, color-mix(in srgb, var(--rc) 45%, #000)); box-shadow:inset 0 -4px 8px rgba(0,0,0,.35); }
.eclat .emb{ position:relative; z-index:1; font-size:24px; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,.45)); }
.eclat .etx{ min-width:0; display:flex; flex-direction:column; line-height:1.15; }
.eclat .etx b{ font-family:"Pirata One", Georgia, serif; font-weight:400; font-size:19px; color:var(--parch); }
.eclat .etx span{ font-size:12.5px; color:var(--ink); }
.eclat .etx small{ font-size:11px; color:var(--muted); margin-top:1px; }

.eclat.charged{ animation:eglow 2.2s ease-in-out infinite; }
.eclat.charged .medal::before{ animation:spin 5s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes eglow{ 50%{ box-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 18px 2px color-mix(in srgb, var(--rc) 55%, transparent); } }
.eclat:active{ transform:translateY(2px); }
.eclat:disabled{ cursor:not-allowed; background:var(--sea-2); border-color:var(--line); }
.eclat:disabled .medal{ filter:grayscale(1) brightness(.7); }
.eclat:disabled .etx b{ color:var(--muted); }
.eclat.used .medal .emb::after{ content:"✓"; position:absolute; right:-10px; bottom:-10px; width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:11px; background:var(--verdigris); color:#062019; filter:none; }
.seat .ecl{ font-size:13px; }

.seat .es{ display:inline-flex; align-items:center; gap:4px; margin-top:4px; font-size:11px; font-weight:700; line-height:1; padding:3px 7px 3px 4px; border-radius:10px; white-space:nowrap; }
.seat .es .eic{ font-size:13px; }

.seat .es.off{ color:var(--muted); background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.12); }
.seat .es.off .eic{ filter:grayscale(1); opacity:.5; }

/* activation splash */
.esplash{ position:fixed; inset:0; z-index:62; pointer-events:none; display:grid; place-items:center; overflow:hidden; animation:esfade 1.5s ease-out forwards; }
.esplash .rays{ position:absolute; width:180vmax; height:180vmax; border-radius:50%;
  background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 55%, transparent) 0 8deg, transparent 8deg 20deg);
  -webkit-mask:radial-gradient(circle, #000 0%, transparent 55%); mask:radial-gradient(circle, #000 0%, transparent 55%); animation:rays 1.5s linear; }
.esplash .core{ position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; animation:escore 1.5s cubic-bezier(.2,1.3,.4,1) forwards; }
.esplash .big{ width:120px; height:120px; border-radius:50%; display:grid; place-items:center; font-size:64px;
  background:radial-gradient(circle at 40% 30%, color-mix(in srgb, var(--rc) 40%, #fff), var(--rc) 55%, color-mix(in srgb, var(--rc) 40%, #000));
  box-shadow:0 0 0 5px #fff4d0, 0 0 0 9px var(--rc), 0 0 60px 20px color-mix(in srgb, var(--rc) 60%, transparent); }
.esplash b{ font-family:"Pirata One", Georgia, serif; font-weight:400; font-size:clamp(36px, 10vw, 56px); color:var(--parch); text-shadow:0 3px 0 rgba(0,0,0,.5), 0 0 20px rgba(0,0,0,.6); margin-top:8px; }
.esplash span{ font-weight:700; color:#fff; text-shadow:0 1px 3px #000; }
@keyframes rays{ from{ transform:rotate(0) scale(.4); } to{ transform:rotate(40deg) scale(1); } }
@keyframes escore{ 0%{ transform:scale(.3); opacity:0; } 25%{ transform:scale(1.08); opacity:1; } 35%{ transform:scale(1); } 80%{ opacity:1; } 100%{ transform:translateY(-24px) scale(.96); opacity:0; } }
@keyframes esfade{ 0%{ background:rgba(8,23,31,0); } 15%{ background:rgba(8,23,31,.55); } 80%{ background:rgba(8,23,31,.45); } 100%{ background:rgba(8,23,31,0); } }
.ready{ flex:none; align-self:center; white-space:nowrap; border:none; border-radius:12px; padding:14px 16px; font-weight:700; font-size:15px; background:var(--brass); color:#2a1b03; box-shadow:0 4px 0 var(--brass-dk); touch-action:manipulation; }
.ready small{ display:block; margin-top:2px; font-size:10.5px; font-weight:600; opacity:.75; }
.ready.confirm{ background:#e8744f; color:#fff; box-shadow:0 4px 0 #9c3a22; animation:bump .4s; }
.ready.wait{ background:var(--deck); color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.35); }

/* ---------- deck viewer ---------- */
.deckbtn{ display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:13px; color:var(--ink); padding:4px 10px 4px 8px; border-radius:10px; background:var(--sea-2); border:1px solid color-mix(in srgb, var(--brass) 55%, transparent); box-shadow:0 2px 0 rgba(0,0,0,.35); }
.deckbtn b{ font-weight:700; }

.dk-stack{ position:relative; width:16px; height:20px; }
.dk-stack i{ position:absolute; inset:0; border-radius:3px; background:var(--parch); border:1px solid #8c7650; }
.dk-stack i:nth-child(1){ transform:translate(-3px, 2px) rotate(-10deg); background:var(--parch-2); }
.dk-stack i:nth-child(2){ transform:translate(-1px, 1px) rotate(-4deg); }
.dk-stack i:nth-child(3){ transform:translate(2px, 0) rotate(5deg); background:linear-gradient(135deg, var(--parch), var(--parch-2)); }
#sheet:empty{ display:none; }
.sheet-bg{ position:fixed; inset:0; z-index:80; background:rgba(6,18,24,.72); display:flex; align-items:flex-end; justify-content:center; animation:sheetbg .2s ease-out; }
@keyframes sheetbg{ from{ opacity:0; } }
.sheet{ width:min(720px, 100%); max-height:88vh; display:flex; flex-direction:column; background:linear-gradient(var(--deck), var(--abyss)); border:1px solid var(--line); border-bottom:none; border-radius:20px 20px 0 0;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px)); box-shadow:0 -12px 40px rgba(0,0,0,.5); animation:sheetup .28s cubic-bezier(.2,.9,.3,1); }

/* ---------- menus ---------- */

  font-size:clamp(58px, 17vw, 104px); line-height:.82; color:var(--parch); text-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 30px rgba(0,0,0,.35); }

.bigbtn.primary span{ color:#5a3f0e; }

/* menu modes come alive under the finger or the mouse */
.bigbtn{ position:relative; overflow:hidden; cursor:pointer; transition:transform .22s cubic-bezier(.3,1.4,.5,1), box-shadow .22s, border-color .22s, background-color .22s; }
.bigbtn .mi{ display:inline-block; font-style:normal; transition:transform .3s cubic-bezier(.3,1.6,.5,1); }
.bigbtn::after{ content:""; position:absolute; top:0; bottom:0; left:-60%; width:40%; transform:skewX(-20deg); background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); pointer-events:none; opacity:0; }
.bigbtn:not(:disabled):hover, .bigbtn:not(:disabled):focus-visible{ transform:translateY(-3px) scale(1.015); border-color:var(--brass); box-shadow:0 8px 0 rgba(0,0,0,.28), 0 0 22px -6px var(--brass); }
.bigbtn.primary:not(:disabled):hover, .bigbtn.primary:not(:disabled):focus-visible{ box-shadow:0 8px 0 var(--brass-dk), 0 0 26px -4px var(--brass); }
.bigbtn:not(:disabled):hover::after, .bigbtn:not(:disabled):focus-visible::after{ opacity:1; animation:shine .8s ease-out; }
.bigbtn:not(:disabled):hover .mi, .bigbtn:not(:disabled):focus-visible .mi{ animation:wiggle .6s ease-in-out; transform:scale(1.25); }
.bigbtn:not(:disabled):active{ transform:translateY(2px) scale(.985); box-shadow:0 2px 0 rgba(0,0,0,.3); transition-duration:.08s; }
.menu .bigbtn{ animation:menuIn .5s cubic-bezier(.3,1.3,.5,1) both; }
.menu .bigbtn:nth-child(2){ animation-delay:.07s; } .menu .bigbtn:nth-child(3){ animation-delay:.14s; } .menu .bigbtn:nth-child(4){ animation-delay:.21s; } .menu .bigbtn:nth-child(5){ animation-delay:.28s; }
@keyframes shine{ from{ left:-60%; } to{ left:130%; } }
@keyframes wiggle{ 0%{ transform:scale(1) rotate(0); } 30%{ transform:scale(1.3) rotate(-14deg); } 60%{ transform:scale(1.25) rotate(10deg); } 100%{ transform:scale(1.25) rotate(0); } }

.panel{ background:var(--sea-2); border:1px solid var(--line); border-radius:16px; padding:14px; }

  box-shadow:0 0 0 8px rgba(255,215,106,.22), 0 0 34px 10px rgba(255,200,80,.55) !important; animation:coachpulse 1.1s ease-in-out infinite !important; }

.voyage{ display:flex; flex-direction:column; gap:10px; text-align:left; background:var(--sea-2); border:1px solid var(--line); border-radius:16px; padding:14px; }
.voyage h3{ margin:0; font-family:"Pirata One", Georgia, serif; font-weight:400; font-size:24px; color:var(--parch); }
.vrow{ display:flex; align-items:center; gap:10px; }
.vrow .vn{ flex:none; width:92px; font-size:13px; font-weight:700; color:var(--parch); line-height:1.15; }
.vrow .vn small{ display:block; font-weight:600; color:var(--muted); }
.vnodes{ display:flex; align-items:center; flex:1; }
.vnodes i{ font-style:normal; width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:14px; background:var(--abyss); border:1px solid var(--line); }
.vnodes i.el{ border-color:#e0573f; } .vnodes i.bs{ width:36px; height:36px; font-size:18px; border:2px solid var(--brass); box-shadow:0 0 10px -2px var(--brass); }
.vnodes b{ flex:1; height:2px; min-width:6px; background:var(--line); }
.vport{ font-size:12.5px; color:var(--brass); padding-left:102px; }
.vlist{ margin:0; padding-left:18px; font-size:14px; color:var(--ink); }
.vlist li{ margin:3px 0; }
.toast{ position:fixed; left:50%; transform:translateX(-50%); top:calc(14px + env(safe-area-inset-top,0px)); background:var(--deck); border:1px solid var(--brass); padding:9px 14px; border-radius:12px; z-index:70; display:none; max-width:90vw; text-align:center; }
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important; }
  .float, .bn, .flash, .card.ghost{ display:none !important; }
}

/* ---- Aventure ---- */
.camptop{ display:grid; gap:6px; margin:6px 0 14px; }
.camptop h2{ margin:0; font-size:26px; }
.camptop p{ margin:0; color:var(--muted); font-size:14px; line-height:1.45; }
.camptop .ctot{ justify-self:start; font-weight:800; color:var(--brass); padding:3px 10px; border-radius:20px; background:rgba(217,164,65,.12); border:1px solid rgba(217,164,65,.4); }
.csec{ display:grid; gap:10px; padding:12px; margin-bottom:12px; border-radius:16px; background:var(--sea-2); border:1px solid var(--line); }
.csec header{ display:flex; gap:12px; align-items:center; }
.csec .cic{ font-size:30px; line-height:1; }
.csec h3{ margin:0; font-size:18px; }
.csec header p{ margin:2px 0 0; color:var(--muted); font-size:13px; line-height:1.35; }
.csec.soon{ opacity:.55; }
.csec.ghost{ opacity:.35; } .csec.ghost .cic{ font-size:22px; font-weight:800; width:30px; text-align:center; color:var(--muted); }
.csec header .clk{ margin-left:auto; font-size:13px; color:var(--muted); }
.cep.ghost{ cursor:default; opacity:.4; min-height:56px; }
.cep.won .ccode{ color:#7fe0a0; }
.cinfo .cnew{ color:var(--brass); font-weight:700; }
.csec.locked .ceps{ opacity:.7; }
.ceps{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; }
@media (max-width:560px){ .ceps{ grid-template-columns:repeat(2, minmax(0, 1fr)); } }
.cep{ display:grid; gap:4px; justify-items:start; text-align:left; padding:9px 10px; border-radius:12px; background:var(--sea); border:1px solid var(--line); color:var(--ink); cursor:pointer; min-height:78px; }
.cep b{ font-size:13.5px; line-height:1.2; }
.cep .ccode{ font-size:11px; font-weight:800; color:var(--brass); letter-spacing:.04em; }
.cep.on{ border-color:var(--brass); box-shadow:0 0 0 1px var(--brass) inset; }
.cep.lock{ cursor:default; opacity:.55; }
.cep .clock{ font-size:13px; }
.stars{ display:inline-flex; gap:1px; font-size:14px; letter-spacing:0; }
.stars i{ font-style:normal; color:rgba(255,255,255,.18); }
.stars i.on{ color:#ffd66b; text-shadow:0 0 6px rgba(255,214,107,.5); }
.csetup{ display:grid; gap:10px; padding:12px; border-radius:12px; background:var(--sea); border:1px solid rgba(217,164,65,.35); }
.cinfo h3{ margin:2px 0 4px; font-size:19px; }
.cinfo p{ margin:0 0 6px; font-size:14px; line-height:1.45; }

.cpk{ flex:0 0 auto; scroll-snap-align:start; display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-width:120px; max-width:150px; padding:7px 10px; border-radius:10px; text-align:left; font:inherit; font-size:13px; font-weight:700; color:var(--ink); background:var(--sea-2); border:2px solid var(--line); cursor:pointer; }
.cpk span{ font-size:11px; color:var(--brass); } .cpk.won span{ color:var(--verdigris); }
.cpk.on{ border-color:var(--brass); background:color-mix(in srgb, var(--brass) 18%, var(--sea-2)); }
.tmode{ margin:6px 0; }
.crewhelp{ font-size:13px; line-height:1.4; color:var(--muted); background:var(--sea-2); border-radius:10px; padding:9px 12px; }

.crewhelp ul{ margin:2px 0 4px; padding-left:18px; } .crewhelp li{ margin:2px 0; } .crewhelp li b{ color:var(--ink); }
.intro{ display:grid; gap:10px; text-align:left; }
.intro h3{ margin:0; font-size:22px; }

.intro .inov p{ margin:4px 0 0; font-size:14.5px; line-height:1.45; }

.cunlock{ margin:0 auto 12px; padding:10px 14px; border-radius:12px; background:rgba(217,164,65,.14); border:1px solid rgba(217,164,65,.5); font-size:15px; }
.eclat-off{ flex:1; }
.ready.atkend, .ready.wait.atkwait{ flex:1; }

function makeRoute(G){
  if(G.camp){   // campaign epic: its own steps, enemies and boss
    const C = CAMP[G.camp], pk = a => a[Math.floor(Math.random() * a.length)], pool = shuffle([...C.pool]); let k = 0;
    return (C.steps || CAMP_STEPS).map(t => t === 'boss' ? {f:[C.boss], z:C.z, boss:1} : t === 'rest' ? {f:[], z:C.z, rest:1} : t === 'el' ? {f:pk(C.elites || C.pool), z:C.z, el:1}
      : t === 'my' ? (Math.random() < MYST_FIGHT ? {f:pool[(k++) % pool.length], z:C.z, myst:1} : {f:[], e:pk(Object.keys(EVENTS)), z:C.z, myst:1}) : {f:pool[(k++) % pool.length], z:C.z});
  }
  const E = EPICS[G.ep - 1], pick = a => a[Math.floor(Math.random() * a.length)];
  const pool = shuffle([...E.pool]);
  const r = pool.slice(0, 2).map(f => ({f, z:E.z}));
  r.push({f:pick(E.elites), z:E.z, el:1});
  r.push(Math.random() < MYST_FIGHT ? {f:pool[2], z:E.z, myst:1} : {f:[], e:pick(Object.keys(EVENTS)), z:E.z, myst:1});
  r.push({f:[], z:E.z, rest:1});
  r.push({f:[G.bosses[G.ep - 1]], z:E.z, boss:1});
  return r;
}

  const wait = ms => Promise.race([sleep(ms), skipped]);
  const fromFight = prev.phase === 'fight';
  if(fromFight && $('#scene')){
    if(window.scrollY > 10){ window.scrollTo({top:0, behavior:'smooth'}); await sleep(350); }
    document.querySelectorAll('.foe').forEach(el => { el.classList.remove('dead'); el.classList.add('sinking'); });
    const sc = $('#scene'); if(sc){ const d = document.createElement('div'); d.className = 'winflag'; d.innerHTML = `<b>Victoire !</b>${v.hull > prev.hull ? `<span>Coque +${v.hull - prev.hull}</span>` : ''}`; sc.appendChild(d); }
    splash(); await sleep(1900);
  }
  if(v.phase === 'tutend') return;
  // the sea map: the ship sails from the finished step to the next one
  const newEp = (v.ep || 1) !== (prev.ep || 1) || (prev.phase === 'port' && prev.port && prev.port.k === 'port');
  const R = routeFromView(v), L = stepLabel(v), E = epOfV(v);
  const inPort = v.phase === 'port' && v.port && v.port.k === 'port';
  const to = inPort || v.phase === 'win' ? R.length : Math.max(0, v.node), from = newEp ? -1 : inPort || v.phase === 'win' ? R.length - 1 : Math.max(-1, v.node - 1);
  const icon = (n, i) => i < to ? '✓' : n.boss ? '👑' : n.el ? '🔥' : n.rest ? '🏝️' : n.myst ? '❓' : '⚔';
  const o = document.createElement('div'); o.id = 'voyfx'; o.className = 'voyfx';
  o.innerHTML = `<div class="vbox">
      ${newEp ? `<div class="vep">${esc(E.n)}<small>${esc(E.z)} · ${esc(E.tr || '')}</small></div>` : `<div class="vep sm">${esc(E.z)}</div>`}
      <div class="vmap"><div class="vline"></div>${R.map((n, i) => `<i class="${i < to ? 'done' : i === to ? 'next' : ''}" style="left:${(i + .5) / R.length * 100}%">${icon(n, i)}</i>`).join('')}
        ${!inPort ? '' : `<i class="next port" style="left:100%">⚓</i>`}
        <span class="vship" style="--x0:${(Math.max(from, -.5) + .5) / R.length * 100}%;--x1:${Math.min(to + .5, R.length) / R.length * 100}%">⛵</span></div>
      <div class="vdest"><span class="vic">${L.ic}</span><b>${esc(L.t)}</b><small>${esc(L.sub || '')}</small></div>
      ${newEp && (v.ep || 1) > 1 && v.nc ? `<div class="vmk">📦 La cale s'agrandit : <b>${v.nc} nouvelles caisses</b>, jusqu'à ${v.mc} 🕯️ de profondeur<span class="vmk-ic">${(v.ncl || []).map(c => `<i title="${esc(CARDS[c].n)}">${ART[c] || '🃏'}</i>`).join('')}</span></div>` : ''}
      <div class="vhull">Coque ${v.hull}/${v.maxHull}</div>
      <div class="vskip">Touche pour continuer</div></div>`;
  o.addEventListener('click', () => skip());
  document.body.appendChild(o);
  requestAnimationFrame(() => o.classList.add('on'));
  await wait(newEp ? ((v.ep || 1) > 1 && v.nc ? 5200 : 3800) : 3000);
  o.classList.remove('on'); o.classList.add('off'); await sleep(300);
}

// robot crewmates act one after another, a moment after the human can see the new turn
function scheduleBots(){
  if(mode !== 'local' || !G || !G.seats.some(S => S.bot) || ui.botT) return;
  ui.botT = setTimeout(runBots, 900);
}
function runBots(){
  ui.botT = null;
  if(mode !== 'local' || !G) return;
  if(ui.playing){ scheduleBots(); return; }
  if(G.phase === 'fight' && G.sub === 'atk'){ const c = capSeat(G); if(G.seats[c].bot){ aiAttack(G); publish(); } return; }   // a robot captain fires
  // a teammate's power (the Captain's « Hissez les voiles »…) can hand cards or candles to a robot that already ended its turn: wake it up to use them
  if(G.phase === 'fight') G.seats.forEach(S => { if(S.bot && S.rd && !S.ab && (S.hand.some(c => !CARDS[c].junk) || S.g > (S.rdg || 0))) S.rd = false; });
  if(ui.coach >= 0 && G.phase === 'fight' && G.seats.some(S => !S.bot && !S.ab && !S.rd)) return;   // during the guided turn, robots play after the human
  const i = G.seats.findIndex(S => S.bot && !S.rd && !S.ab);
  if(i < 0 || (G.phase !== 'fight' && G.phase !== 'port')) return;
  const st = G.stg;
  if(G.phase === 'fight') aiTurn(G, i); else aiStop(G, i);
  if(G.stg === st && (G.phase === 'fight' || G.phase === 'port')){ const S = G.seats[i]; S.rdg = S.g; if(!S.rd) setReady(G, i, true); }   // not if its blow just ended the step
  publish();
}

function deckGroups(deck, pile){
  const count = {}; deck.forEach(c => count[c] = (count[c] || 0) + 1);
  const codes = Object.keys(count);
  const order = c => { const C = CARDS[c]; return C.leg ? -1 : C.role ? 0 : !C.f ? 1 : 2 + 'FMCT'.indexOf(C.f); };
  codes.sort((a, b) => order(a) - order(b) || (CARDS[a].$ || 0) - (CARDS[b].$ || 0) || CARDS[a].n.localeCompare(CARDS[b].n));
  const groups = [];
  for(const c of codes){
    const C = CARDS[c], key = C.junk ? 'junk' : C.leg ? 'leg' : C.role || !C.f ? 'base' : C.f;
    const label = key === 'junk' ? (pile ? '🩹 Blessures' : "🩹 Blessures tenaces (jusqu'au prochain port)") : key === 'leg' ? '✨ Légendaires' : key === 'base' ? 'Cartes de départ' : `${FACTIONS[key].ic} ${FACTIONS[key].n}`;
    let g = groups.find(x => x.key === key); if(!g){ g = {key, label, items:[]}; groups.push(g); }
    g.items.push([c, count[c]]);
  }
  return groups;
}

function setHullDom(h, p, max, b = 0){

  const chip = $('#hull .brchip'); if(chip && !b) chip.remove();
  const ratio = Math.max(0, h) / max;
  if(bar) bar.style.width = (ratio * 100) + '%';
  if(lab) lab.textContent = `Coque ${Math.max(0, h)}/${max}`;
  if(pr){ pr.textContent = b ? '−' + b : p; pr.classList.toggle('zero', !p && !b); pr.classList.toggle('breach', !!b); }

    ship.classList.toggle('shielded', p > 0); ship.classList.toggle('damaged', ratio < .5);
    ship.style.setProperty('--sink', ((1 - ratio) * 16).toFixed(1) + 'px'); ship.style.setProperty('--tilt', ((1 - ratio) * 7).toFixed(1) + 'deg');
